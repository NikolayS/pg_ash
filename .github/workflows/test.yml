      - name: "Dev workflow: re-apply in-progress migrations when present"
        env:
          PGPASSWORD: postgres
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          export PAGER=cat

          # Idempotency scope (issue #50, blueprints/SPEC.md "Legacy
          # upgrade-script idempotency"): finalized legacy upgrade scripts
          # are immutable and idempotent only on the version just below —
          # e.g. ash-1.1-to-1.2 is safe to re-run on a 1.2 install, but NOT
          # on a 2.0 install (2.0 removes the 1.x reader surface and
          # helpers like ash._to_sample_ts that those scripts recreate).
          # Only the in-progress development upgrade script(s) — latest
          # released version up to the dev head — are kept re-apply-safe in
          # lockstep with the dev installer, so reapply-chain emits exactly
          # those. Legacy scripts are still exercised end-to-end by the
          # one-shot upgrade-chain tests above.
          python3 devel/scripts/ash_sql_chain.py fresh-install-path | sed 's#^#\\i #' > /tmp/ash_fresh_install.sql
          python3 devel/scripts/ash_sql_chain.py reapply-chain > /tmp/ash_reapply_chain.sql
          if [[ ! -s /tmp/ash_reapply_chain.sql ]]; then
            printf '%s\n' \
              "No in-progress migrations to re-apply; the pinned v1.5 upgrade step tests release-wrapper re-apply."
            exit 0
          fi
          psql \
            --no-psqlrc \
            --host=localhost \
            --username=postgres \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --set=expected_version="$(python3 devel/scripts/ash_sql_chain.py fresh-install-version)" << 'EOF'
          select set_config('pg_ash.expected_version', :'expected_version', false);

          \i /tmp/ash_fresh_install.sql

          -- Apply all discovered re-apply-safe upgrade scripts on top of fresh install.
          \i /tmp/ash_reapply_chain.sql

          do $$
          begin
            assert (select version from ash.config where singleton) = current_setting('pg_ash.expected_version'),
              'version should still match latest released version';
            raise notice 'Idempotent re-apply PASSED';
          end;
          $$;

          -- Set missed_samples to a known value before re-apply
          update ash.config set missed_samples = 42 where singleton;

          -- Apply again — must preserve data
          \i /tmp/ash_reapply_chain.sql

          do $$
          begin
            assert (select version from ash.config where singleton) = current_setting('pg_ash.expected_version'),
              'version should still match latest released version after second apply';
            assert (select missed_samples from ash.config where singleton) = 42,
              'missed_samples should be preserved (42) after idempotent re-apply';
            -- The 2.0 readers must still be callable after re-apply. No data
            -- was seeded here, so a missing or broken function would raise.
            perform * from ash.timeline(now() - interval '1 hour', now());
            perform ash.report(now() - interval '1 hour', now());
            raise notice 'Second re-apply PASSED (missed_samples preserved)';
          end;
          $$;

          select ash.uninstall('yes');
          EOF

      - name: "Release upgrade: actual v1.5 to current preserves state and reader grants (#107)"
        env:
          PGPASSWORD: postgres
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          export PAGER=cat

          # Issue #107 (B1): the installer drops and recreates functions whose
          # signatures changed across versions, and DROP FUNCTION destroys
          # EXECUTE grants that CREATE OR REPLACE would have preserved. A
          # monitoring role configured with ash.grant_reader() before an
          # upgrade must keep its reader access after it — and after any
          # re-apply of the release upgrade wrapper.
          #
          # Pin the actual previous release. The generic full chain cannot
          # establish this precondition after a release stamp: the historical
          # 1.3-to-1.4 shim intentionally replays the current installer, so it
          # now jumps directly to 2.0 before the 1.5-to-2.0 wrapper is reached.
          git show v1.5:sql/ash-install.sql > /tmp/ash-v1.5-install.sql
          psql \
            --no-psqlrc \
            --host=localhost \
            --username=postgres \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 \
            --set=expected_version="$(python3 devel/scripts/ash_sql_chain.py fresh-install-version)" << 'EOF'
          select set_config('pg_ash.expected_version', :'expected_version', false);
          \i /tmp/ash-v1.5-install.sql

          do $$
          begin
            assert (select version from ash.config where singleton) = '1.5',
              'precondition: pinned installer must be v1.5';
            assert to_regprocedure(
              'ash.top_waits(interval,integer,integer,boolean)'
            ) is not null,
              'precondition: v1.5 reader surface is missing ash.top_waits';
            assert to_regprocedure(
              'ash.top(text,timestamptz,timestamptz,text,text,bigint,name,integer,interval,text)'
            ) is null,
              'precondition: 2.0 ash.top must not exist before the upgrade';
            if not exists (select from pg_roles where rolname = 'ash_b1_reader') then
              create role ash_b1_reader login password 'x';
            end if;
          end $$;

          select ash.grant_reader('ash_b1_reader');

          -- Representative production state that the release upgrade must
          -- preserve: non-default config plus a decodable raw sample whose
          -- wait and query-map dictionary rows predate 2.0.
          update ash.config
          set missed_samples = 42,
              sample_interval = interval '7 seconds',
              include_bg_workers = true
          where singleton;

          do $$
          declare
            v_wait_id smallint;
            v_query_map_id int4;
            v_slot smallint := ash.current_slot();
            v_sample_ts int4 := ash.ts_from_timestamptz(
              now() - interval '1 minute'
            );
          begin
            select ash._register_wait('active', 'UpgradeProbe', 'Preserved')
              into v_wait_id;
            execute format(
              'insert into ash.query_map_%s(query_id) values (424242) returning id',
              v_slot
            ) into v_query_map_id;
            insert into ash.sample(sample_ts, datid, active_count, data, slot)
            values (
              v_sample_ts,
              (select oid from pg_database where datname = current_database()),
              1,
              array[-v_wait_id, 1, v_query_map_id]::int4[],
              v_slot
            );
          end $$;

          -- Snapshot which ash.* functions the reader can execute at the
          -- released version. Function names only: signatures may
          -- legitimately change across versions (that is exactly why the
          -- installer drops them).
          create table public.v15_acl_before as
          select distinct p.proname::text as proname
          from pg_proc p
          join pg_namespace n on n.oid = p.pronamespace
          where n.nspname = 'ash'
            and p.prokind = 'f'
            and has_function_privilege('ash_b1_reader', p.oid, 'EXECUTE');

          do $$
          begin
            assert (select count(*) from public.v15_acl_before) > 10,
              'sanity: grant_reader should cover a non-trivial function set';
          end $$;

          \i sql/ash-1.5-to-2.0.sql

          -- Release identity, surface convergence, and persisted state must
          -- all be correct on the first real v1.5-to-current transition.
          do $$
          declare
            v_default text;
            v_expected text := current_setting('pg_ash.expected_version');
            v_count int;
            v_data_points bigint;
            v_positive_rows bigint;
            v_legend_rows bigint;
            v_since timestamptz;
            v_until timestamptz;
            v_aas record;
            v_compare record;
            v_top record;
            v_report jsonb;
          begin
            assert (select version from ash.config where singleton) = v_expected,
              'v1.5-to-current upgrade stamped the wrong ash.config.version';

            select pg_get_expr(attr_default.adbin, attr_default.adrelid)
              into v_default
            from pg_attrdef as attr_default
            join pg_attribute as attr
              on attr.attrelid = attr_default.adrelid
             and attr.attnum = attr_default.adnum
            where attr_default.adrelid = 'ash.config'::regclass
              and attr.attname = 'version';
            assert v_default = format('%L::text', v_expected),
              format('version column default is %s, expected %L::text',
                     v_default, v_expected);

            select count(distinct proc.proname) into v_count
            from pg_proc as proc
            join pg_namespace as nsp on nsp.oid = proc.pronamespace
            where nsp.nspname = 'ash'
              and proc.proname in (
                'periods', 'aas', 'timeline', 'top', 'compare',
                'samples', 'report', 'chart', 'summary'
              );
            assert v_count = 9,
              format('2.0 reader surface incomplete after v1.5 upgrade: %s/9',
                     v_count);

            select count(*) into v_count
            from pg_proc as proc
            join pg_namespace as nsp on nsp.oid = proc.pronamespace
            where nsp.nspname = 'ash'
              and proc.proname in (
                'top_waits', 'top_queries', 'wait_timeline',
                'activity_summary', 'timeline_chart', 'query_waits',
                'event_queries', 'samples_by_database'
              );
            assert v_count = 0,
              format('v1.x readers remain after v1.5 upgrade: %s function(s)',
                     v_count);

            assert (select missed_samples from ash.config where singleton) = 42,
              'missed_samples was not preserved across v1.5 upgrade';
            assert (select sample_interval from ash.config where singleton)
                     = interval '7 seconds',
              'sample_interval was not preserved across v1.5 upgrade';
            assert (select include_bg_workers from ash.config where singleton),
              'include_bg_workers was not preserved across v1.5 upgrade';
            select date_trunc('minute', sample_row.sample_time)
                   + interval '1 minute'
              into v_until
            from ash.samples(
              now() - interval '5 minutes',
              now(),
              100
            ) as sample_row
            where sample_row.wait_event = 'UpgradeProbe:Preserved'
              and sample_row.query_id = 424242
            limit 1;
            assert v_until is not null,
              'seeded v1.5 raw sample was not preserved/decodable after upgrade';
            v_since := v_until - interval '5 minutes';

            -- Exercise every 2.0 reader on the upgraded state. Catalog checks
            -- above prove surface convergence; these assertions prove behavior.
            -- Anchor the window to the seeded sample so a wall-clock minute
            -- rollover during the upgrade cannot move it outside the 1m case.
            select count(*),
                   max(buckets_with_data) filter (where period = '1m')
              into v_count, v_data_points
            from ash.periods(v_until);
            assert v_count = 6,
              format('ash.periods expected 6 standard windows, got %s', v_count);
            assert v_data_points = 1,
              format('ash.periods 1m expected 1 data bucket, got %s',
                     v_data_points);

            select * into v_aas from ash.aas(v_since, v_until);
            assert v_aas.buckets_with_data = 1,
              format('ash.aas expected 1 data bucket, got %s',
                     v_aas.buckets_with_data);
            assert v_aas.backend_seconds = 7.00,
              format('ash.aas expected 7 backend-seconds, got %s',
                     v_aas.backend_seconds);

            select count(*), sum(data_points)
              into v_count, v_data_points
            from ash.timeline(v_since, v_until, interval '1 minute');
            assert v_count = 5,
              format('ash.timeline expected 5 buckets, got %s', v_count);
            assert v_data_points = 1,
              format('ash.timeline expected 1 data point, got %s',
                     v_data_points);

            select * into v_top
            from ash.top('wait_event', v_since, v_until, n => 10);
            assert v_top.key = 'UpgradeProbe:Preserved',
              format('ash.top returned unexpected key: %s', v_top.key);
            assert v_top.backend_seconds = 7.00 and v_top.pct = 100.00,
              format('ash.top expected 7 backend-seconds at 100%%, got %s at %s%%',
                     v_top.backend_seconds, v_top.pct);

            select * into v_compare
            from ash.compare(v_since, v_until, v_since, v_until);
            assert v_compare.key = 'overall' and v_compare.avg_delta = 0.00,
              format('ash.compare identical windows expected zero delta, got %s',
                     v_compare.avg_delta);

            select count(*) into v_count
            from ash.samples(v_since, v_until, 100)
            where wait_event = 'UpgradeProbe:Preserved'
              and query_id = 424242
              and active_backends = 1;
            assert v_count = 1,
              format('ash.samples expected exactly 1 seeded row, got %s', v_count);

            perform ash.rollup_minute();
            v_report := ash.report(v_since, v_until);
            assert (v_report #>> '{coverage,minutes_with_data}')::int = 1,
              format('ash.report expected 1 covered minute, got %s',
                     v_report #>> '{coverage,minutes_with_data}');

            select count(*),
                   count(*) filter (where bucket_start is null),
                   count(*) filter (where aas > 0)
              into v_count, v_legend_rows, v_positive_rows
            from ash.chart(
              v_since,
              v_until,
              interval '1 minute',
              3,
              40,
              false
            );
            assert v_count = 6 and v_legend_rows = 1 and v_positive_rows = 1,
              format(
                'ash.chart expected 6 rows/1 legend/1 active, got %s/%s/%s',
                v_count,
                v_legend_rows,
                v_positive_rows
              );

            select count(*) into v_count
            from ash.summary(v_since, v_until)
            where metric = 'top_wait_1'
              and value like 'UpgradeProbe:Preserved%';
            assert v_count = 1,
              format('ash.summary expected the seeded top wait, got %s row(s)',
                     v_count);
          end $$;

          -- ACL equivalence sweep: every function name the reader could
          -- execute before the upgrade and that still exists must remain
          -- executable on every current overload. Nothing is enumerated, so
          -- any future drop/recreate that loses reader grants fails here.
          do $$
          declare
            v_lost text;
          begin
            select string_agg(distinct p.proname::text, ', ' order by p.proname::text)
              into v_lost
            from public.v15_acl_before b
            join pg_proc p on p.proname::text = b.proname
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'ash'
              and p.prokind = 'f'
              and not has_function_privilege('ash_b1_reader', p.oid, 'EXECUTE');
            assert v_lost is null,
              format('reader EXECUTE grants lost across upgrade on: %s', v_lost);
          end $$;

          -- 2.0 is a breaking reader rework: the v1.x readers are dropped and
          -- new readers/helpers are created. A role that held the full reader
          -- bundle pre-upgrade is re-run through ash.grant_reader() by the
          -- installer's restore, so it must hold the COMPLETE current reader
          -- set afterwards: surviving functions (status, decode_sample), the
          -- recreated `samples`, the brand-new 2.0 readers, AND the new
          -- internal helpers those readers call as SECURITY INVOKER.
          do $$
          begin
            assert has_function_privilege('ash_b1_reader', 'ash.samples(timestamptz,timestamptz,int,text,text,bigint,name)', 'EXECUTE'),
              '#107: ash.samples lost reader EXECUTE across upgrade';
            assert has_function_privilege('ash_b1_reader', 'ash.status()', 'EXECUTE'),
              '#107: ash.status lost reader EXECUTE across upgrade';
            assert has_function_privilege('ash_b1_reader', 'ash.decode_sample(integer[],smallint)', 'EXECUTE'),
              '#107: ash.decode_sample lost reader EXECUTE across upgrade';
            assert has_function_privilege('ash_b1_reader', 'ash.top(text,timestamptz,timestamptz,text,text,bigint,name,int,interval,text)', 'EXECUTE'),
              '#107: preserved reader must gain the new 2.0 readers (ash.top)';
            assert has_function_privilege('ash_b1_reader', 'ash._pgss_query_text(bigint,int)', 'EXECUTE'),
              '#107: preserved reader must gain new internal helpers (ash._pgss_query_text)';
            assert has_function_privilege('ash_b1_reader', 'ash._raw_retention_start()', 'EXECUTE'),
              '#107: preserved reader must gain new internal helpers (ash._raw_retention_start)';

            -- No escalation: restoring grants must not widen the role's
            -- reach to admin functions or re-open PUBLIC.
            assert not has_function_privilege('ash_b1_reader', 'ash.start(interval)', 'EXECUTE'),
              '#107: ash.start must remain admin-only after upgrade';
            assert not has_function_privilege('ash_b1_reader', 'ash.take_sample()', 'EXECUTE'),
              '#107: ash.take_sample must remain admin-only after upgrade';
            assert not has_function_privilege('ash_b1_reader', 'ash.grant_reader(name)', 'EXECUTE'),
              '#107: ash.grant_reader must remain admin-only after upgrade';
            assert not has_function_privilege('ash_b1_reader', 'ash.revoke_reader(name)', 'EXECUTE'),
              '#107: ash.revoke_reader must remain admin-only after upgrade';
            assert not has_function_privilege('public', 'ash.samples(timestamptz,timestamptz,int,text,text,bigint,name)', 'EXECUTE'),
              '#107: PUBLIC must not gain EXECUTE on ash.samples';

            raise notice 'issue #107: reader grants preserved across upgrade';
          end $$;

          -- Behavioral: the preserved reader must be able to call the whole
          -- 2.0 surface — readers old and new, plus status() — with zero
          -- permission errors. Sample first so data-dependent helper paths
          -- (e.g. _pgss_query_text laterals) actually execute as the invoker.
          select ash.take_sample();
          set role ash_b1_reader;
          do $$
          declare
            v_calls constant text[] := array[
              'ash.samples(now() - interval ''1 hour'', now())',
              'ash.aas()',
              'ash.top(''query_id'')',
              'ash.top(''wait_event'')',
              'ash.timeline()',
              'ash.periods()',
              'ash.report()',
              'ash.chart()',
              'ash.summary()',
              'ash.status()',
              'ash.decode_sample_at(now())'
            ];
            v_call text;
            v_cnt bigint;
            v_failed text[] := '{}';
            v_admin_denied boolean := false;
          begin
            foreach v_call in array v_calls loop
              begin
                execute format('select count(*) from %s', v_call) into v_cnt;
              exception
                when insufficient_privilege or undefined_function or invalid_schema_name then
                  v_failed := v_failed || (v_call || ' -> ' || sqlerrm);
              end;
            end loop;
            assert cardinality(v_failed) = 0,
              '#107: preserved reader cannot use the 2.0 surface: ' || array_to_string(v_failed, '; ');

            begin
              perform ash.take_sample();
            exception
              when insufficient_privilege then
                v_admin_denied := true;
            end;
            assert v_admin_denied,
              '#107: preserved reader unexpectedly executed ash.take_sample';
            raise notice 'issue #107: preserved reader can call the full 2.0 surface';
          end $$;
          reset role;

          -- Re-apply the public release wrapper, not merely the installer: the
          -- documented v1.5-to-2.0 entrypoint promises to be re-apply-safe.
          \i sql/ash-1.5-to-2.0.sql

          do $$
          declare
            v_lost text;
          begin
            select string_agg(distinct p.proname::text, ', ' order by p.proname::text)
              into v_lost
            from public.v15_acl_before b
            join pg_proc p on p.proname::text = b.proname
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'ash'
              and p.prokind = 'f'
              and not has_function_privilege('ash_b1_reader', p.oid, 'EXECUTE');
            assert v_lost is null,
              format('reader EXECUTE grants lost across installer re-apply on: %s', v_lost);

            assert not has_function_privilege('ash_b1_reader', 'ash.take_sample()', 'EXECUTE'),
              '#107: ash.take_sample must remain admin-only after re-apply';

            assert (select version from ash.config where singleton)
                     = current_setting('pg_ash.expected_version'),
              'release-wrapper re-apply changed the version';
            assert (select missed_samples from ash.config where singleton) = 42,
              'release-wrapper re-apply lost missed_samples';
            assert (select sample_interval from ash.config where singleton)
                     = interval '7 seconds',
              'release-wrapper re-apply lost sample_interval';
            assert (select include_bg_workers from ash.config where singleton),
              'release-wrapper re-apply lost include_bg_workers';
            assert exists (
              select from ash.samples(now() - interval '5 minutes', now(), 100)
              where wait_event = 'UpgradeProbe:Preserved'
                and query_id = 424242
            ), 'release-wrapper re-apply lost the seeded v1.5 raw sample';

            raise notice 'issue #107: state and reader grants preserved across release-wrapper re-apply';
          end $$;

          set role ash_b1_reader;
          select count(*) from ash.samples(now() - interval '1 hour', now());
          reset role;

          drop table public.v15_acl_before;
          select ash.uninstall('yes');
          drop role ash_b1_reader;
          EOF

      - name: "Issue #107 follow-up: grant restore stays least-privilege"
        env:
          PGPASSWORD: postgres
        run: |
          # The #107 grant snapshot/restore must not become a privilege-widening
          # vector. On every installer re-apply it must:
          #   (a) NOT re-establish a stray non-owner EXECUTE grant on an admin
          #       function after the hardening block revoked it (before #107,
          #       DROP FUNCTION scrubbed such grants);
          #   (b) NOT widen a role that held a single overload of a function to
          #       its sibling overloads (restore by exact signature);
          #   while still preserving legitimate ash.grant_reader() grants.
          python3 devel/scripts/ash_sql_chain.py fresh-install-path | sed 's#^#\\i #' > /tmp/ash_fresh_install.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          \i /tmp/ash_fresh_install.sql

          do $$ begin
            if not exists (select from pg_roles where rolname = 'lp_reader')   then create role lp_reader   login password 'x'; end if;
            if not exists (select from pg_roles where rolname = 'lp_stray')    then create role lp_stray    login password 'x'; end if;
            if not exists (select from pg_roles where rolname = 'lp_overload') then create role lp_overload login password 'x'; end if;
          end $$;

          -- legitimate reader: must SURVIVE re-apply (guards the #107 fix)
          select ash.grant_reader('lp_reader');
          -- stray manual grant on an admin function in the drop list: must be SCRUBBED
          grant execute on function ash.rebuild_partitions(int, text) to lp_stray;
          -- single-overload grant: must NOT widen to the sibling overload
          grant execute on function ash.decode_sample(integer[], smallint) to lp_overload;

          do $$ begin
            assert has_function_privilege('lp_stray', 'ash.rebuild_partitions(int,text)', 'EXECUTE'),
              'precondition: stray admin grant present before re-apply';
            assert has_function_privilege('lp_overload', 'ash.decode_sample(integer[],smallint)', 'EXECUTE'),
              'precondition: array overload granted';
            assert not has_function_privilege('lp_overload', 'ash.decode_sample(integer)', 'EXECUTE'),
              'precondition: integer overload not granted yet';
          end $$;

          -- re-apply the installer: drop/recreate + snapshot/restore + hardening
          \i /tmp/ash_fresh_install.sql

          do $$ begin
            -- (1) #107 still fixed: legitimate reader keeps every reader grant
            assert has_function_privilege('lp_reader', 'ash.top(text,timestamptz,timestamptz,text,text,bigint,name,int,interval,text)', 'EXECUTE'),
              '#107 regression: reader lost ash.top across re-apply';
            assert has_function_privilege('lp_reader', 'ash.report(timestamptz,timestamptz,int,int)', 'EXECUTE'),
              '#107 regression: reader lost ash.report across re-apply';
            assert has_function_privilege('lp_reader', 'ash.samples(timestamptz,timestamptz,int,text,text,bigint,name)', 'EXECUTE'),
              '#107 regression: reader lost ash.samples across re-apply';

            -- (2) admin-function grant must be scrubbed and NOT restored after hardening
            assert not has_function_privilege('lp_stray', 'ash.rebuild_partitions(int,text)', 'EXECUTE'),
              'admin EXECUTE grant re-established after hardening (defense-in-depth regression)';
            assert not has_function_privilege('lp_reader', 'ash.rebuild_partitions(int,text)', 'EXECUTE'),
              'reader must not gain admin function EXECUTE';
            assert not has_function_privilege('lp_reader', 'ash.take_sample()', 'EXECUTE'),
              'reader must not gain take_sample';

            -- (3) no overload widening
            assert has_function_privilege('lp_overload', 'ash.decode_sample(integer[],smallint)', 'EXECUTE'),
              'held overload should survive re-apply';
            assert not has_function_privilege('lp_overload', 'ash.decode_sample(integer)', 'EXECUTE'),
              'single-overload grant must NOT widen to the sibling overload';

            -- (4) PUBLIC stays revoked
            assert not has_function_privilege('public', 'ash.top(text,timestamptz,timestamptz,text,text,bigint,name,int,interval,text)', 'EXECUTE'),
              'PUBLIC must stay revoked';

            raise notice 'issue #107 follow-up: grant restore stayed least-privilege';
          end $$;

          drop owned by lp_reader, lp_stray, lp_overload;
          select ash.uninstall('yes');
          drop role lp_reader;
          drop role lp_stray;
          drop role lp_overload;
          EOF

      - name: "Schema equivalence: fresh dev install vs full upgrade path"
        env:
          PGPASSWORD: postgres
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          export PAGER=cat

          psql_base=(
            psql
            --no-psqlrc
            --host=localhost
            --username=postgres
            --dbname=postgres
          )

          cat > /tmp/ash_schema_snapshot.sql << 'SNAPSQL'
          \pset tuples_only on
          \pset format unaligned
          select 'FUNC', p.proname,
                 pg_get_function_identity_arguments(p.oid),
                 pg_get_function_result(p.oid),
                 md5(p.prosrc)
          from pg_proc p
          join pg_namespace n on n.oid = p.pronamespace
          where n.nspname = 'ash'
          order by p.proname, pg_get_function_identity_arguments(p.oid);

          select 'COL', c.relname, a.attname,
                 pg_catalog.format_type(a.atttypid, a.atttypmod),
                 a.attnotnull,
                 pg_get_expr(d.adbin, d.adrelid)
          from pg_class c
          join pg_namespace n on n.oid = c.relnamespace
          join pg_attribute a on a.attrelid = c.oid
          left join pg_attrdef d on d.adrelid = a.attrelid and d.adnum = a.attnum
          where n.nspname = 'ash' and c.relkind in ('r','p') and a.attnum > 0 and not a.attisdropped
          order by c.relname, a.attname;

          select 'IDX', c.relname, pg_get_indexdef(i.indexrelid)
          from pg_index i
          join pg_class c on c.oid = i.indexrelid
          join pg_namespace n on n.oid = c.relnamespace
          where n.nspname = 'ash'
          order by c.relname;

          select 'VIEW', viewname, md5(definition)
          from pg_views
          where schemaname = 'ash'
          order by viewname;

          -- Issue #66: include CHECK / NOT NULL / PK / UNIQUE / FK constraints.
          -- Covers parent partitioned tables AND their partitions (relkind r,p).
          -- pg_get_constraintdef gives a stable canonical text form, so any
          -- divergence (e.g. sample_data_check `>= 2` vs `>= 3` from #49)
          -- surfaces here.
          select 'CON', c.relname, con.conname, pg_get_constraintdef(con.oid)
          from pg_constraint con
          join pg_class c on c.oid = con.conrelid
          join pg_namespace n on n.oid = c.relnamespace
          where n.nspname = 'ash' and c.relkind in ('r','p')
          order by c.relname, con.conname;

          -- Issue #107: privilege state must be equivalent too. proacl is
          -- NULL until the first GRANT/REVOKE touches a function; the
          -- installer's REVOKE-from-PUBLIC hardening always runs, so a fresh
          -- install and the full upgrade chain must converge to identical
          -- explicit function ACLs.
          select 'FACL', p.proname,
                 pg_get_function_identity_arguments(p.oid),
                 coalesce(p.proacl::text, '<default>')
          from pg_proc p
          join pg_namespace n on n.oid = p.pronamespace
          where n.nspname = 'ash'
          order by p.proname, pg_get_function_identity_arguments(p.oid);
          SNAPSQL

          python3 devel/scripts/ash_sql_chain.py full-upgrade-chain > /tmp/ash_full_upgrade_chain.sql
          git show v1.5:sql/ash-install.sql > /tmp/ash-v1.5-install.sql

          # 1) Fresh install → snapshot
          "${psql_base[@]}" \
            --set=ON_ERROR_STOP=1 \
            --file="$(python3 devel/scripts/ash_sql_chain.py fresh-install-path)" \
            > /dev/null 2>&1
          "${psql_base[@]}" \
            --set=ON_ERROR_STOP=1 \
            --file=/tmp/ash_schema_snapshot.sql \
            > /tmp/fresh_schema.txt
          "${psql_base[@]}" \
            --command="select ash.uninstall('yes')" \
            > /dev/null 2>&1

          # 2) Full upgrade path → snapshot
          "${psql_base[@]}" \
            --set=ON_ERROR_STOP=1 \
            --file=/tmp/ash_full_upgrade_chain.sql \
            > /dev/null 2>&1
          "${psql_base[@]}" \
            --set=ON_ERROR_STOP=1 \
            --file=/tmp/ash_schema_snapshot.sql \
            > /tmp/upgraded_schema.txt
          "${psql_base[@]}" \
            --command="select ash.uninstall('yes')" \
            > /dev/null 2>&1

          # 3) Actual previous release → current release wrapper → snapshot.
          # This must remain separate from full-upgrade-chain: historical
          # installer shims replay the current installer and therefore cannot
          # prove the final v1.5-to-current edge after a release stamp.
          "${psql_base[@]}" \
            --set=ON_ERROR_STOP=1 \
            --file=/tmp/ash-v1.5-install.sql \
            > /dev/null 2>&1
          "${psql_base[@]}" \
            --set=ON_ERROR_STOP=1 \
            --file=sql/ash-1.5-to-2.0.sql \
            > /dev/null 2>&1
          "${psql_base[@]}" \
            --set=ON_ERROR_STOP=1 \
            --file=/tmp/ash_schema_snapshot.sql \
            > /tmp/upgraded_v15_schema.txt
          "${psql_base[@]}" \
            --command="select ash.uninstall('yes')" \
            > /dev/null 2>&1

          # 4) Compare fresh against both supported upgrade paths.
          if diff -u /tmp/fresh_schema.txt /tmp/upgraded_schema.txt; then
            echo "Schema equivalence test PASSED: fresh dev install and upgrade path produce identical schemas"
          else
            echo "::error::Schema equivalence test FAILED: fresh dev install and upgrade path differ (see diff above)"

            # Issue #66: when constraints diverge, surface a clear, dedicated
            # error naming each affected constraint and both definitions, so
            # CHECK-constraint regressions (e.g. sample_data_check `>= 2` vs
            # `>= 3`) don't get lost in a long unified diff over
            # functions/columns/indexes/views.
            grep '^CON|' /tmp/fresh_schema.txt    | sort > /tmp/fresh_constraints.txt
            grep '^CON|' /tmp/upgraded_schema.txt | sort > /tmp/upgraded_constraints.txt
            if ! diff -q /tmp/fresh_constraints.txt /tmp/upgraded_constraints.txt > /dev/null; then
              echo "::error::Constraint divergence detected (issue #66):"
              # Each CON line is: CON|<relname>|<conname>|<def>
              # Pair fresh vs upgrade by (relname, conname) and report both
              # definitions for any (relname, conname) present on only one
              # side or whose definition differs.
              awk -F'|' '
                FNR == NR { fresh[$2"|"$3] = $0; next }
                {
                  key = $2"|"$3
                  if (!(key in fresh)) {
                    def = $4; for (i = 5; i <= NF; i++) def = def "|" $i
                    printf "  upgrade ash.%s.%s: %s\n", $2, $3, def
                    printf "  fresh   ash.%s.%s: <missing>\n", $2, $3
                  } else if (fresh[key] != $0) {
                    def = $4; for (i = 5; i <= NF; i++) def = def "|" $i
                    printf "  upgrade ash.%s.%s: %s\n", $2, $3, def
                    n = split(fresh[key], a, "|")
                    def2 = a[4]; for (i = 5; i <= n; i++) def2 = def2 "|" a[i]
                    printf "  fresh   ash.%s.%s: %s\n", a[2], a[3], def2
                    delete fresh[key]
                  } else {
                    delete fresh[key]
                  }
                }
                END {
                  for (k in fresh) {
                    n = split(fresh[k], a, "|")
                    def = a[4]; for (i = 5; i <= n; i++) def = def "|" a[i]
                    printf "  upgrade ash.%s.%s: <missing>\n", a[2], a[3]
                    printf "  fresh   ash.%s.%s: %s\n", a[2], a[3], def
                  }
                }
              ' /tmp/fresh_constraints.txt /tmp/upgraded_constraints.txt
            fi
            exit 1
          fi

          if diff -u /tmp/fresh_schema.txt /tmp/upgraded_v15_schema.txt; then
            echo "Schema equivalence test PASSED: fresh install and actual v1.5-to-current upgrade produce identical schemas"
          else
            echo "::error::Schema equivalence test FAILED: fresh install and actual v1.5-to-current upgrade differ"
            exit 1
          fi

      - name: "Degraded mode: without pg_stat_statements"
        env:
          PGPASSWORD: postgres
        run: |
          # Drop pgss, reinstall pg_ash fresh (to test clean no-pgss state).
          # uninstall may fail if the schema was already dropped by a prior
          # step (e.g. "Upgrade path" ends with uninstall). That's expected,
          # so we silence it. But the install that follows MUST succeed.
          psql -h localhost -U postgres -d postgres -c "select ash.uninstall('yes')" 2>/dev/null || echo "ash.uninstall skipped (schema absent)"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "drop extension if exists pg_stat_statements"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$(python3 devel/scripts/ash_sql_chain.py fresh-install-path)" > /dev/null

          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          -- Degraded mode: pg_ash freshly installed WITHOUT pg_stat_statements.
          -- Every 2.0 reader must work; query_text degrades to NULL and is never spoofed
          -- by a user-created public.pg_stat_statements relation (#87).
          insert into ash.wait_event_map (state, type, event) values
            ('active', 'CPU*', 'CPU*') on conflict do nothing;
          insert into ash.query_map_0 (query_id) values (999999) on conflict do nothing;

          do $$
          declare
            v_cpu smallint; v_q1 int4; v_ts int4; v_from timestamptz;
            n int; tcnt int; j jsonb;
          begin
            select id into v_cpu from ash.wait_event_map where type = 'CPU*';
            select id into v_q1 from ash.query_map_0 where query_id = 999999;
            -- Minute-aligned 3 minutes back so a window from here reads raw.
            v_ts := (ash.ts_from_timestamptz(date_trunc('minute', now() - interval '3 minutes')) / 60) * 60;
            v_from := ash.ts_to_timestamptz(v_ts);
            insert into ash.sample (sample_ts, datid, active_count, data, slot)
              values (v_ts, 1, 1, array[-v_cpu, 1, v_q1]::integer[], 0);
            perform ash.rollup_minute();

            -- Every reader runs without pgss; query_text is NULL, no error, no WARNING.
            perform ash.periods();
            perform * from ash.aas(v_from, now());
            perform * from ash.timeline(v_from, now());
            perform * from ash.compare(v_from, now(), v_from, now());
            perform * from ash.summary(v_from, now());
            perform * from ash.chart(v_from, now());
            assert (select query_text from ash.top('query_id', v_from, now()) limit 1) is null,
              'top query_text should be NULL without pgss';
            assert (select query_text from ash.samples(v_from, now()) limit 1) is null,
              'samples query_text should be NULL without pgss';

            -- report still produces query ids (they come from samples, not pgss).
            j := ash.report(v_from, now());
            assert j is not null, 'report should work without pgss';
            assert j->'top_queryids_worst1m' ? 'total', 'report top_queryids total should be present';

            perform ash.take_sample();
            perform ash.status();
            perform ash.set_debug_logging();

            -- #87: a user-made public.pg_stat_statements must NOT be trusted as the real
            -- extension — no row fan-out, no spoofed query_text.
            create table public.pg_stat_statements (
              queryid bigint, query text, calls bigint,
              total_exec_time double precision, mean_exec_time double precision, dbid oid);
            insert into public.pg_stat_statements values
              (999999, 'select same from user_a', 10, 100.0, 10.0, 1::oid),
              (999999, 'select same from user_b', 20, 400.0, 20.0, 2::oid);

            select count(*), count(query_text) into n, tcnt
              from ash.top('query_id', v_from, now()) where key = '999999';
            assert n = 1 and tcnt = 0,
              format('top must ignore spoofed pg_stat_statements, got rows=%s text_rows=%s', n, tcnt);
            select count(*), count(query_text) into n, tcnt
              from ash.samples(v_from, now()) where query_id = 999999;
            assert n = 1 and tcnt = 0,
              format('samples must ignore spoofed pg_stat_statements, got rows=%s text_rows=%s', n, tcnt);

            drop table public.pg_stat_statements;
            raise notice 'All degraded-mode (no pgss) 2.0 reader tests PASSED';
          end $$;
          EOF

          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "select ash.uninstall('yes')"

          # Restore pgss for subsequent steps — must succeed.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "create extension if not exists pg_stat_statements"

      - name: "Degraded mode: without pg_cron"
        env:
          PGPASSWORD: postgres
        run: |
          # Install pg_ash fresh without pg_cron.
          # `drop extension if exists` is a no-op when pg_cron isn't installed
          # (e.g. PG19 beta where PGDG package may be missing, or matrix.cron=off).
          # Use ON_ERROR_STOP so unrelated failures don't get silenced.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "drop extension if exists pg_cron cascade"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$(python3 devel/scripts/ash_sql_chain.py fresh-install-path)" > /dev/null

          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          do $$
          declare
            v_rec record;
            v_status_val text;
          begin
            -- start() should work without pg_cron (no error, prints hints)
            select status into v_status_val
            from ash.start('1 second')
            where job_type = 'sampler';
            assert v_status_val like '%schedule externally%',
              'start() without pg_cron should say schedule externally, got: ' || v_status_val;

            -- stop() should work without pg_cron
            select status into v_status_val
            from ash.stop()
            limit 1;
            assert v_status_val like '%external scheduler%',
              'stop() without pg_cron should mention external scheduler, got: ' || v_status_val;

            -- status() should show pg_cron_available = no
            select value into v_status_val
            from ash.status()
            where metric = 'pg_cron_available';
            assert v_status_val like '%no%',
              'status() should show pg_cron not available, got: ' || v_status_val;

            -- take_sample() should work without pg_cron
            perform ash.take_sample();

            -- All 2.0 reader functions should work
            perform ash.periods();
            perform * from ash.top('wait_event', now() - interval '1 hour', now());
            perform * from ash.samples(now() - interval '1 hour', now());
            perform * from ash.chart(now() - interval '1 hour', now());

            raise notice 'All degraded-mode (no pg_cron) tests PASSED';
          end;
          $$;

          select ash.uninstall('yes');
          EOF

      - name: Final summary
        env:
          PGPASSWORD: postgres
          PG_MAJOR: ${{ matrix.postgres }}
          CRON: ${{ matrix.cron }}
        run: |
          echo "All tests passed for PostgreSQL $PG_MAJOR (pg_cron=$CRON)"
