                rel.relacl,
                makeaclitem(reader_role.oid, rel.relowner, 'SELECT', false)
              ),
              false
            ) as custom_direct,
            coalesce(
              aclcontains(
                rel.relacl,
                makeaclitem(pg_monitor.oid, rel.relowner, 'SELECT', false)
              ),
              false
            ) as pg_monitor_direct,
            coalesce(
              aclcontains(
                rel.relacl,
                makeaclitem(member_role.oid, rel.relowner, 'SELECT', false)
              ),
              false
            ) as member_direct
          from pg_class as rel
          join pg_namespace as nsp on nsp.oid = rel.relnamespace
          cross join pg_roles as reader_role
          cross join pg_roles as pg_monitor
          cross join pg_roles as member_role
          where nsp.nspname = 'ash'
            and rel.relname in ('query_map_all', 'query_map_0', 'sample_0')
            and reader_role.rolname = 'ash_b4_reader'
            and pg_monitor.rolname = 'pg_monitor'
            and member_role.rolname = 'ash_b4_pgmon_member'
          order by rel.relname;

          create temp table b4_probe_results (
            role_name name primary key,
            keys text[],
            error_message text
          );
          grant insert on b4_probe_results
            to ash_b4_reader, ash_b4_pgmon_member;

          set role ash_b4_reader;
          do $$
          declare
            v_keys text[];
          begin
            begin
              select coalesce(array_agg(key order by key), '{}'::text[])
                into v_keys
              from ash.top(
                'query_id',
                now() - interval '10 minutes',
                now() + interval '1 minute'
              );
              insert into b4_probe_results (role_name, keys, error_message)
              values (current_user, v_keys, null);
            exception when insufficient_privilege then
              insert into b4_probe_results (role_name, keys, error_message)
              values (current_user, null, sqlerrm);
            end;
          end $$;
          reset role;

          set role ash_b4_pgmon_member;
          do $$
          declare
            v_keys text[];
          begin
            begin
              select coalesce(array_agg(key order by key), '{}'::text[])
                into v_keys
              from ash.top(
                'query_id',
                now() - interval '10 minutes',
                now() + interval '1 minute'
              );
              insert into b4_probe_results (role_name, keys, error_message)
              values (current_user, v_keys, null);
            exception when insufficient_privilege then
              insert into b4_probe_results (role_name, keys, error_message)
              values (current_user, null, sqlerrm);
            end;
          end $$;
          reset role;

          table b4_probe_results;

          do $$
          declare
            v_acl_count int;
            v_error_count int;
            v_errors text;
            v_exact_key_count int;
          begin
            select count(*) into v_acl_count
            from pg_class as rel
            join pg_namespace as nsp on nsp.oid = rel.relnamespace
            cross join pg_roles as grantee_role
            where nsp.nspname = 'ash'
              and rel.relname in ('query_map_all', 'query_map_0', 'sample_0')
              and grantee_role.rolname in ('ash_b4_reader', 'pg_monitor')
              and coalesce(
                aclcontains(
                  rel.relacl,
                  makeaclitem(
                    grantee_role.oid,
                    rel.relowner,
                    'SELECT',
                    false
                  )
                ),
                false
              );
            assert v_acl_count = 6,
              format(
                '#164: expected 6 direct reader ACLs after rebuild, got %s',
                v_acl_count
              );

            select
              count(*) filter (where error_message is not null),
              string_agg(
                format('%s -> %s', role_name, error_message),
                '; '
                order by role_name
              ),
              count(*) filter (
                where keys = array['164000000002']
                  and error_message is null
              )
            into v_error_count, v_errors, v_exact_key_count
            from b4_probe_results;
            assert v_error_count = 0,
              format('#164: post-rebuild reader errors: %s', v_errors);
            assert v_exact_key_count = 2,
              format(
                '#164: expected exact keys for 2 readers after rebuild, got %s',
                v_exact_key_count
              );
          end $$;

          drop table b4_probe_results;
          select ash.rebuild_partitions(3, 'yes');
          update ash.config set sampling_enabled = true where singleton;
          delete from ash.wait_event_map
          where state = 'active'
            and type = 'B4Test'
            and event = 'B4Wait';
          select ash.revoke_reader('ash_b4_reader');
          revoke pg_monitor from ash_b4_pgmon_member;
          drop role ash_b4_reader;
          drop role ash_b4_pgmon_member;
          EOF

      - name: "Issue #166: revoke_reader refuses protected roles"
        env:
          PGPASSWORD: postgres
        run: |
          cleanup_b6() {
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c "drop database if exists ash_b6_owner_test with (force);"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -c "drop role if exists ash_b6_reader, ash_b6_current, ash_b6_owner;"
          }
          trap cleanup_b6 EXIT
          cleanup_b6

          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          create role ash_b6_owner
            login password 'b6'
            nosuperuser nocreatedb nocreaterole;
          create role ash_b6_reader nologin;
          create role ash_b6_current nologin;
          grant ash_b6_current to ash_b6_owner;
          create database ash_b6_owner_test
            owner ash_b6_owner
            template template0;
          EOF

          PGPASSWORD=b6 psql \
            -h localhost \
            -U ash_b6_owner \
            -d ash_b6_owner_test \
            -v ON_ERROR_STOP=1 \
            -f "$(python3 devel/scripts/ash_sql_chain.py fresh-install-path)"

          PGPASSWORD=b6 psql \
            -h localhost \
            -U ash_b6_owner \
            -d ash_b6_owner_test \
            -v ON_ERROR_STOP=1 \
            -v install_path="$(
              python3 devel/scripts/ash_sql_chain.py fresh-install-path
            )" << 'EOF'
          select
            current_user,
            owner_role.rolsuper,
            nsp.nspowner::regrole as ash_owner,
            has_schema_privilege(current_user, 'ash', 'USAGE') as ash_usage,
            has_function_privilege(
              current_user,
              'ash._admin_funcs()',
              'EXECUTE'
            ) as admin_funcs_execute
          from pg_roles as owner_role
          join pg_namespace as nsp on nsp.nspname = 'ash'
          where owner_role.rolname = current_user;

          /*
           * On broken code the revoke returns successfully. Capture the exact
           * two-stage failure: schema USAGE blocks every documented entry
           * point, then restoring USAGE alone exposes the stripped
           * _admin_funcs() EXECUTE privilege underneath.
           */
          do $$
          declare
            v_expected_message constant text :=
              'ash.revoke_reader: refusing protected role ash_b6_owner '
              '(schema owner, current user, or superuser)';
            v_grant_after_usage_message text;
            v_grant_message text;
            v_refused boolean := false;
            v_refusal_message text;
            v_status_message text;
            v_take_sample_message text;
          begin
            begin
              perform ash.revoke_reader(current_user::name);
            exception when others then
              v_refused := true;
              v_refusal_message := sqlerrm;
            end;

            if not v_refused then
              begin
                perform ash.take_sample();
              exception when insufficient_privilege then
                v_take_sample_message := sqlerrm;
              end;

              begin
                perform * from ash.status();
              exception when insufficient_privilege then
                v_status_message := sqlerrm;
              end;

              begin
                perform ash.grant_reader(current_user::name);
              exception when insufficient_privilege then
                v_grant_message := sqlerrm;
              end;

              execute format(
                'grant usage on schema ash to %I',
                current_user
              );
              begin
                perform ash.grant_reader(current_user::name);
              exception when insufficient_privilege then
                v_grant_after_usage_message := sqlerrm;
              end;

              raise notice
                '#166 RED: take_sample=[%], status=[%], grant_reader=[%], '
                'USAGE + grant_reader=[%]',
                v_take_sample_message,
                v_status_message,
                v_grant_message,
                v_grant_after_usage_message;
            end if;

            assert v_refused,
              format(
                '#166: revoke_reader returned successfully; '
                'take_sample=[%s], status=[%s], grant_reader=[%s], '
                'USAGE + grant_reader=[%s]',
                v_take_sample_message,
                v_status_message,
                v_grant_message,
                v_grant_after_usage_message
              );
            assert v_refusal_message = v_expected_message,
              format(
                '#166: refusal expected [%s], got [%s]',
                v_expected_message,
                v_refusal_message
              );
            assert has_schema_privilege(current_user, 'ash', 'USAGE') = true,
              '#166: refused call must preserve owner schema USAGE';
            assert has_function_privilege(
              current_user,
              'ash._admin_funcs()',
              'EXECUTE'
            ) = true,
              '#166: refused call must preserve owner _admin_funcs EXECUTE';
            assert has_function_privilege(
              current_user,
              'ash.grant_reader(name)',
              'EXECUTE'
            ) = true,
              '#166: refused call must preserve owner grant_reader EXECUTE';
            assert '_admin_funcs' = any(ash._admin_funcs()),
              '#166: _admin_funcs must be in its own admin exclusion set';
            assert ash.take_sample() = 0,
              '#166: take_sample should return exactly 0 in the isolated DB';
            perform * from ash.status();
            raise notice '#166 non-superuser owner refusal PASSED: %',
              v_refusal_message;
          end $$;

          -- _admin_funcs is an administrative implementation detail. A normal
          -- reader neither needs nor receives EXECUTE on it, and revoking that
          -- reader remains an allowed operation.
          select ash.grant_reader('ash_b6_reader');
          do $$
          begin
            assert has_function_privilege(
              'ash_b6_reader',
              'ash._admin_funcs()',
              'EXECUTE'
            ) = false,
              '#166: grant_reader must not grant _admin_funcs EXECUTE';
          end $$;

          /*
           * Simulate a reader bundle created by the previous installer, when
           * _admin_funcs still belonged to the reader set. CREATE OR REPLACE
           * preserves function ACLs, so re-apply must explicitly scrub this
           * legacy bundle grant rather than merely stop issuing new ones.
           */
          grant execute on function ash._admin_funcs()
            to ash_b6_reader, pg_monitor;
          do $$
          begin
            assert has_function_privilege(
              'ash_b6_reader',
              'ash._admin_funcs()',
              'EXECUTE'
            ) = true,
              '#166: legacy reader precondition must hold _admin_funcs EXECUTE';
            assert has_function_privilege(
              'pg_monitor',
              'ash._admin_funcs()',
              'EXECUTE'
            ) = true,
              '#166: legacy pg_monitor precondition must hold _admin_funcs EXECUTE';
          end $$;
          \i :install_path
          do $$
          begin
            assert has_function_privilege(
              'ash_b6_reader',
              'ash._admin_funcs()',
              'EXECUTE'
            ) = false,
              '#166: installer re-apply must scrub legacy _admin_funcs EXECUTE';
            assert has_function_privilege(
              'pg_monitor',
              'ash._admin_funcs()',
              'EXECUTE'
            ) = false,
              '#166: re-apply must scrub legacy pg_monitor _admin_funcs EXECUTE';
            raise notice '#166 legacy reader ACL scrub PASSED';
          end $$;
          select ash.revoke_reader('ash_b6_reader');

          -- Exercise current_user independently: this target is neither the
          -- schema owner nor a superuser. The temporary grants only make the
          -- owner-only helper callable far enough to reach its early guard.
          grant usage on schema ash to ash_b6_current;
          grant execute on function ash._admin_funcs() to ash_b6_current;
          grant execute on function ash.revoke_reader(name) to ash_b6_current;
          set role ash_b6_current;
          do $$
          declare
            v_expected_message constant text :=
              'ash.revoke_reader: refusing protected role ash_b6_current '
              '(schema owner, current user, or superuser)';
            v_message text;
          begin
            assert current_user = 'ash_b6_current',
              format('#166: current_user precondition got %s', current_user);
            assert (
              select rolsuper from pg_roles where rolname = current_user
            ) = false,
              '#166: current_user branch requires a non-superuser';
            assert (
              select nspowner::regrole::text
              from pg_namespace
              where nspname = 'ash'
            ) <> current_user,
              '#166: current_user branch must not be the schema-owner branch';

            begin
              perform ash.revoke_reader(current_user::name);
            exception when others then
              v_message := sqlerrm;
            end;
            assert v_message = v_expected_message,
              format(
                '#166: current_user refusal expected [%s], got [%s]',
                v_expected_message,
                v_message
              );
          end $$;
          reset role;

          -- Exercise the superuser target independently from current_user and
          -- schema ownership.
          do $$
          declare
            v_expected_message constant text :=
              'ash.revoke_reader: refusing protected role postgres '
              '(schema owner, current user, or superuser)';
            v_message text;
          begin
            assert current_user = 'ash_b6_owner',
              format('#166: owner session precondition got %s', current_user);
            assert (
              select rolsuper from pg_roles where rolname = 'postgres'
            ) = true,
              '#166: postgres must be a superuser for this branch';
            assert (
              select nspowner::regrole::text
              from pg_namespace
              where nspname = 'ash'
            ) <> 'postgres',
              '#166: superuser target must not be the schema-owner branch';

            begin
              perform ash.revoke_reader('postgres');
            exception when others then
              v_message := sqlerrm;
            end;
            assert v_message = v_expected_message,
              format(
                '#166: superuser refusal expected [%s], got [%s]',
                v_expected_message,
                v_message
              );
          end $$;
          EOF

          # Exercise schema ownership independently: postgres is the invoker,
          # while the protected non-superuser target owns schema ash.
          psql \
            -h localhost \
            -U postgres \
            -d ash_b6_owner_test \
            -v ON_ERROR_STOP=1 << 'EOF'
          do $$
          declare
            v_expected_message constant text :=
              'ash.revoke_reader: refusing protected role ash_b6_owner '
              '(schema owner, current user, or superuser)';
            v_message text;
          begin
            assert current_user = 'postgres',
              format('#166: superuser invoker precondition got %s', current_user);
            assert (
              select rolsuper from pg_roles where rolname = 'ash_b6_owner'
            ) = false,
              '#166: schema-owner target must be a non-superuser';
            assert (
              select nspowner::regrole::text
              from pg_namespace
              where nspname = 'ash'
            ) = 'ash_b6_owner',
              '#166: ash_b6_owner must own schema ash';

            begin
              perform ash.revoke_reader('ash_b6_owner');
            exception when others then
              v_message := sqlerrm;
            end;
            assert v_message = v_expected_message,
              format(
                '#166: schema-owner refusal expected [%s], got [%s]',
                v_expected_message,
                v_message
              );
            raise notice '#166 protected-target guards PASSED';
          end $$;
          EOF

      - name: "Test 2.0: grant_reader NOTICEs missing pg_read_all_stats; query_text needs it (final re-test papercut)"
        env:
          PGPASSWORD: postgres
        run: |
          # Two throwaway reader roles: one plain (no pg_monitor), one pg_monitor
          # member. grant_reader gives both the reader bundle but NEVER pg_read_all_stats
          # (least privilege), so query_text from pg_stat_statements is visible only to
          # the member — and grant_reader must SAY SO for the plain role.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          do $$ begin
            if not exists (select from pg_roles where rolname = 'ash_qt_plain') then create role ash_qt_plain login password 'x'; end if;
            if not exists (select from pg_roles where rolname = 'ash_qt_mon') then create role ash_qt_mon login password 'x'; end if;
          end $$;
          grant pg_monitor to ash_qt_mon;
          EOF

          # (b) grant_reader on a NON-pg_monitor role must emit the pg_read_all_stats NOTICE.
          out=$(psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
                  -c "select ash.grant_reader('ash_qt_plain');" 2>&1)
          echo "$out"
          echo "$out" | grep -q "ash_qt_plain lacks pg_read_all_stats" \
            || { echo "FAIL: grant_reader must NOTICE that a non-pg_monitor role lacks pg_read_all_stats"; exit 1; }
          # a pg_monitor member already holds pg_read_all_stats -> no such NOTICE.
          out=$(psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
                  -c "select ash.grant_reader('ash_qt_mon');" 2>&1)
          echo "$out"
          if echo "$out" | grep -q "lacks pg_read_all_stats"; then
            echo "FAIL: grant_reader must NOT warn about pg_read_all_stats for a pg_monitor member"; exit 1;
          fi

          # (a/c) query_text: NULL for the plain role, populated for the member. Skip
          # cleanly when pgss is unavailable for this PG major; the probe SELECT must run
          # at top level (pgss does not capture a statement executed inside a DO block).
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          select exists (select 1 from pg_extension where extname = 'pg_stat_statements') as has_pgss \gset
          \if :has_pgss
          select pg_stat_statements_reset();
          select 918273645 as ash_qt_probe where 1 = 1;
          do $$
          declare v_qid bigint; v_io smallint; v_q1 int4; v_dp oid;
          begin
            select queryid into v_qid from pg_stat_statements
              where query like '%ash_qt_probe%' and query not like '%pg_stat_statements%' limit 1;
            assert v_qid is not null, 'probe query must be captured in pg_stat_statements';
            truncate ash.sample_0, ash.sample_1, ash.sample_2, ash.query_map_0, ash.query_map_1, ash.query_map_2;
            update ash.config set current_slot = 0 where singleton;
            select ash._register_wait('active','IO','DataFileRead') into v_io;
            insert into ash.query_map_0 (query_id) values (v_qid);
            select id into v_q1 from ash.query_map_0 where query_id = v_qid;
            select oid into v_dp from pg_database where datname = current_database();
            -- Anchor the sample to a COMPLETED past minute: readers floor the window
            -- end to the current minute, so a sample in the not-yet-finished current
            -- minute would be excluded whenever now() is past :30 (flaky).
            insert into ash.sample (sample_ts, datid, active_count, data, slot)
            values (ash.ts_from_timestamptz(date_trunc('minute', now()) - interval '2 minutes'), v_dp, 1,
                    array[-v_io, 1, v_q1]::integer[], 0);
          end $$;
          -- plain role: sees the query_id row (it has SELECT on ash.sample) but NULL
          -- query_text, because pgss restricts other roles' text to pg_read_all_stats holders.
          set role ash_qt_plain;
          do $$
          declare v_qt text; v_n int;
          begin
            select query_text into v_qt from ash.top('query_id', now() - interval '10 minutes', now()) limit 1;
            get diagnostics v_n = row_count;
            assert v_n = 1, 'plain reader must still SEE the query_id row, rows=' || v_n;
            assert v_qt is null,
              'plain grant_reader role without pg_read_all_stats must see NULL query_text even with pgss installed, got: ' || coalesce(v_qt, '<null>');
          end $$;
          reset role;
          -- pg_monitor member: same query_text is populated.
          set role ash_qt_mon;
          do $$
          declare v_qt text;
          begin
            select query_text into v_qt from ash.top('query_id', now() - interval '10 minutes', now()) limit 1;
            assert v_qt is not null and v_qt like '%ash_qt_probe%',
              'pg_monitor member must see populated query_text, got: ' || coalesce(v_qt, '<null>');
          end $$;
          reset role;
          \endif
          -- cleanup so the throwaway roles do not leak into later steps.
          select ash.revoke_reader('ash_qt_plain');
          select ash.revoke_reader('ash_qt_mon');
          revoke pg_monitor from ash_qt_mon;
          drop role ash_qt_plain;
          drop role ash_qt_mon;
          EOF
          echo "grant_reader pg_read_all_stats NOTICE + query_text gating PASSED"

      - name: Test sampler and decoder
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          -- Test take_sample runs without error
          select ash.take_sample();

          -- Test decode_sample round-trip
          do $$
          declare
            v_wait_id smallint;
            v_qid_id int4;
            v_result record;
            v_count int;
          begin
            -- Insert test dictionary entries
            insert into ash.wait_event_map (state, type, event)
            values ('active', 'CPU*', 'CPU*') on conflict do nothing;
            insert into ash.wait_event_map (state, type, event)
            values ('active', 'IO', 'DataFileRead') on conflict do nothing;

            select id into v_wait_id from ash.wait_event_map
            where state = 'active' and type = 'CPU*' and event = 'CPU*';

            insert into ash.query_map_0 (query_id) values (12345) on conflict do nothing;
            select id into v_qid_id from ash.query_map_0 where query_id = 12345;

            -- Decode: 2 backends on CPU*, with query_ids
            select count(*) into v_count
            from ash.decode_sample(array[-v_wait_id, 2, v_qid_id, 0]::integer[]);
            assert v_count = 2, 'decode_sample wrong count: ' || v_count;

            -- Verify decoded fields: 2 backends = 2 rows
            select * into v_result
            from ash.decode_sample(array[-v_wait_id, 2, v_qid_id, 0]::integer[], 0::smallint)
            limit 1;
            assert v_result.wait_event = 'CPU*', 'wrong wait_event: ' || v_result.wait_event;
            assert v_result.query_id = 12345, 'wrong query_id: ' || v_result.query_id;

            raise notice 'Decoder tests PASSED';
          end;
          $$;
          EOF

      - name: Test decode_sample(int4) and decode_sample_at(timestamptz) convenience
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          do $$
          declare
            v_sample_ts int4;
            v_wait_id smallint;
            v_qid_a int4;
            v_qid_b int4;
            v_decoded_int_count int;
            v_decoded_ts_count int;
            v_decoded_int_total int;
            v_decoded_ts_total int;
            v_packed_total int;
            v_distinct_datids int;
            v_diff_count int;
            v_ts timestamptz;
            v_slot smallint;
          begin
            -- Run a real take_sample() first so the call path exercises the
            -- live sampler at least once.
            perform ash.take_sample();

            -- Build a deterministic test sample_ts so the assertions don't
            -- depend on whether the CI runner happens to have active
            -- backends right now. Use a sample_ts in the future to avoid
            -- colliding with anything take_sample() inserted.
            v_sample_ts := ash.ts_from_timestamptz(now()) + 86400;
            v_slot := ash.current_slot();

            -- Ensure dictionary entries exist (may already exist from earlier
            -- decoder test step; on conflict do nothing).
            insert into ash.wait_event_map (state, type, event)
            values ('active', 'CPU*', 'CPU*') on conflict do nothing;
            select id into v_wait_id from ash.wait_event_map
            where state = 'active' and type = 'CPU*' and event = 'CPU*';

            -- Read the active slot's query_map dynamically so this test
            -- stays correct after re-ordering of CI steps and across any
            -- future change to num_partitions.
            execute format(
              'insert into ash.query_map_%s (query_id) values (777001) on conflict do nothing',
              v_slot
            );
            execute format(
              'insert into ash.query_map_%s (query_id) values (777002) on conflict do nothing',
              v_slot
            );
            execute format(
              'select id from ash.query_map_%s where query_id = 777001',
              v_slot
            ) into v_qid_a;
            execute format(
              'select id from ash.query_map_%s where query_id = 777002',
              v_slot
            ) into v_qid_b;

            -- Insert two synthetic ash.sample rows for the same sample_ts
            -- but different datids, so the int4 overload has more than one
            -- ash.sample row to walk and the datid column is exercised.
            -- datid 1 = template1, 2 = postgres in most installs, but we
            -- only need oid values that are distinct and stable.
            insert into ash.sample (sample_ts, datid, active_count, data, slot)
            values
              (v_sample_ts, 1::oid, 2, array[-v_wait_id, 2, v_qid_a, v_qid_b]::integer[], v_slot),
              (v_sample_ts, 2::oid, 1, array[-v_wait_id, 1, v_qid_a]::integer[], v_slot);

            -- decode_sample(int4): expect 3 decoded rows (2 + 1 backends),
            -- each with count=1 and a datid that matches one of the rows we
            -- inserted.
            select count(*), coalesce(sum(d.count), 0), count(distinct d.datid)
              into v_decoded_int_count, v_decoded_int_total, v_distinct_datids
            from ash.decode_sample(v_sample_ts) d;
            assert v_decoded_int_count = 3,
              'decode_sample(int4) row count expected 3, got ' || v_decoded_int_count;
            assert v_decoded_int_total = 3,
              'decode_sample(int4) sum(count) expected 3, got ' || v_decoded_int_total;
            assert v_distinct_datids = 2,
              'decode_sample(int4) distinct datids expected 2, got ' || v_distinct_datids;

            -- Sanity vs. packed active_count.
            select coalesce(sum(active_count), 0) into v_packed_total
            from ash.sample where sample_ts = v_sample_ts;
            assert v_decoded_int_count = v_packed_total,
              'decoded rows ' || v_decoded_int_count
              || ' != packed active_count total ' || v_packed_total;

            -- Verify wait_event + query_id resolution is correct for each
            -- decoded row (uses the row's slot internally, so query_ids are
            -- unambiguous).
            assert exists (
              select 1 from ash.decode_sample(v_sample_ts) d
              where d.datid = 1::oid and d.wait_event = 'CPU*' and d.query_id = 777001
            ), 'decode_sample(int4) missing expected (datid=1, CPU*, 777001) row';
            assert exists (
              select 1 from ash.decode_sample(v_sample_ts) d
              where d.datid = 1::oid and d.wait_event = 'CPU*' and d.query_id = 777002
            ), 'decode_sample(int4) missing expected (datid=1, CPU*, 777002) row';
            assert exists (
              select 1 from ash.decode_sample(v_sample_ts) d
              where d.datid = 2::oid and d.wait_event = 'CPU*' and d.query_id = 777001
            ), 'decode_sample(int4) missing expected (datid=2, CPU*, 777001) row';

            -- decode_sample_at(timestamptz): round-trip and confirm we get
            -- identical decoded rows.
            v_ts := ash.ts_to_timestamptz(v_sample_ts);
            select count(*), coalesce(sum(d.count), 0)
              into v_decoded_ts_count, v_decoded_ts_total
            from ash.decode_sample_at(v_ts) d;
            assert v_decoded_ts_count = v_decoded_int_count,
              'decode_sample_at(timestamptz) row count ' || v_decoded_ts_count
              || ' != decode_sample(int4) ' || v_decoded_int_count;
            assert v_decoded_ts_total = v_decoded_int_total,
              'decode_sample_at(timestamptz) sum(count) ' || v_decoded_ts_total
              || ' != decode_sample(int4) ' || v_decoded_int_total;

            -- Row-level equality: every (datid, wait_event, query_id, count)
            -- tuple from decode_sample_at(timestamptz) must match
            -- decode_sample(int4) exactly, in both directions.
            select count(*) into v_diff_count from (
              select datid, wait_event, query_id, count
              from ash.decode_sample_at(v_ts)
              except
              select datid, wait_event, query_id, count
              from ash.decode_sample(v_sample_ts)
            ) d;
            assert v_diff_count = 0,
              'decode_sample_at(timestamptz) has rows not in decode_sample(int4): '
              || v_diff_count;
            select count(*) into v_diff_count from (
              select datid, wait_event, query_id, count
              from ash.decode_sample(v_sample_ts)
              except
              select datid, wait_event, query_id, count
              from ash.decode_sample_at(v_ts)
            ) d;
            assert v_diff_count = 0,
              'decode_sample(int4) has rows not in decode_sample_at(timestamptz): '
              || v_diff_count;

            -- Empty input: a sample_ts with no rows must return zero rows.
            assert (select count(*) from ash.decode_sample(-1)) = 0,
              'decode_sample(int4) on missing sample_ts should return 0 rows';

            -- NULL input: NULL-as-int4 should return zero rows (not error).
            -- The 1-arg unknown-NULL case is covered by the existing
            -- decoder corner-cases step via ::integer[] cast; here we
            -- verify the int4 overload behaves the same.
            assert (select count(*) from ash.decode_sample(null::int4)) = 0,
              'decode_sample(null::int4) should return 0 rows';
            assert (select count(*) from ash.decode_sample_at(null::timestamptz)) = 0,
              'decode_sample_at(null::timestamptz) should return 0 rows';

            -- Regression for #54: an unadorned integer literal must resolve
            -- unambiguously to decode_sample(int4). 0 is the epoch boundary,
            -- which has no rows in CI -- so a successful overload bind
            -- returns exactly 0 rows. If the call ever errors with
            -- "function ash.decode_sample(unknown) is not unique", or if it
            -- mis-binds and returns rows from another partition, this fails.
            assert (select count(*) from ash.decode_sample(0)) = 0,
              'decode_sample(<unadorned literal>) must resolve to int4 overload and return 0 rows at epoch';

            -- Clean up the synthetic rows so later steps see a normal table.
            delete from ash.sample where sample_ts = v_sample_ts;
            execute format(
              'delete from ash.query_map_%s where query_id in (777001, 777002)',
              v_slot
            );

            raise notice 'decode_sample(int4) / decode_sample_at(timestamptz) tests PASSED';
          end;
          $$;
          EOF

      - name: Test missed_samples counter (timeout catching)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOFTEST'
          -- Reset counter
          update ash.config set missed_samples = 0 where singleton;

          -- 1. Verify missed_samples column exists and defaults to 0
          do $$
          begin
            assert exists (
              select from information_schema.columns
              where table_schema = 'ash' and table_name = 'config' and column_name = 'missed_samples'
            ), 'missed_samples column missing from ash.config';
            assert (select missed_samples from ash.config where singleton) = 0,
              'missed_samples should default to 0';
            raise notice 'TEST 1 PASSED: missed_samples column exists, defaults to 0';
          end;
          $$;

          -- 2. Verify take_sample works normally (returns >= 0, missed_samples stays 0)
          do $$
          declare
            v_result int;
          begin
            select ash.take_sample() into v_result;
            assert v_result >= 0, 'take_sample should return >= 0 without timeout, got: ' || v_result;
            assert (select missed_samples from ash.config where singleton) = 0,
              'missed_samples should be 0 after successful sample';
            raise notice 'TEST 2 PASSED: normal sampling works (returned %)', v_result;
          end;
          $$;

          -- 3. Simulate query_canceled via pg_cancel_backend to test the handler
          -- This is deterministic — no timing dependency on CI runner speed
          create or replace function test_simulate_cancel()
          returns int language plpgsql as $$
          begin
            -- Cancel our own backend; pg_sleep gives PG time to deliver the signal
            perform pg_cancel_backend(pg_backend_pid());
            perform pg_sleep(1);
            return 0;  -- never reached
          exception when query_canceled then
            update ash.config set missed_samples = missed_samples + 1 where singleton;
            return -1;
          end;
          $$;

          do $$
          declare
            v_result int;
            v_missed int;
          begin
            select test_simulate_cancel() into v_result;
            assert v_result = -1, 'simulated cancel should return -1, got: ' || v_result;

            select missed_samples into v_missed from ash.config where singleton;
            assert v_missed = 1, 'missed_samples should be 1 after simulated cancel, got: ' || v_missed;
            raise notice 'TEST 3 PASSED: cancel handler works (missed_samples = %)', v_missed;
          end;
          $$;

          drop function test_simulate_cancel();

          -- 4. Status should show missed_samples metric
          do $$
          declare
            v_val text;
          begin
            select value into v_val from ash.status() where metric = 'missed_samples';
            assert v_val is not null, 'status() should show missed_samples metric';
            assert v_val::int >= 1, 'missed_samples in status should be >= 1';
            raise notice 'TEST 4 PASSED: status() shows missed_samples (value = %)', v_val;
          end;
          $$;

          -- 5. Verify take_sample return value on idle DB is 0 (not -1)
          update ash.config set missed_samples = 0 where singleton;
          do $$
          declare
            v_result int;
          begin
            select ash.take_sample() into v_result;
            assert v_result = 0, 'take_sample on idle DB should return 0, got: ' || v_result;
            assert (select missed_samples from ash.config where singleton) = 0,
              'missed_samples should still be 0 (no timeout occurred)';
            raise notice 'TEST 5 PASSED: idle DB returns 0, missed_samples stays 0';
          end;
          $$;
          EOFTEST

          echo "Missed samples tests PASSED"

      - name: Test rotation
        env:
          PGPASSWORD: postgres
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'
          export PAGER=cat

          psql \
            --no-psqlrc \
            --host=localhost \
            --username=postgres \
            --dbname=postgres \
            --set=ON_ERROR_STOP=1 << 'EOF'
          do $$
          declare
            v_slot_before smallint;
            v_slot_after smallint;
            v_target_slot smallint;
            v_count int;
            v_next_id int;
            v_fixture_minute int4 := (
              ash.ts_from_timestamptz(
                date_trunc('minute', now()) - interval '2 minutes'
              ) / 60
            ) * 60;
          begin
            select current_slot into v_slot_before from ash.config;

            -- Keep the fixture in two adjacent, recently completed minutes.
            -- Ancient sample_ts values forced rollup_minute() to scan a full
            -- 1,440-minute rotation batch and emit one gap warning per minute
            -- whenever earlier tests had left a recent sample behind.
            insert into ash.sample (sample_ts, datid, active_count, data)
            values (v_fixture_minute + 60, 1, 2, '{-1,2,1,1}');

            -- new_slot = (old + 1) % N, truncate_slot = (new_slot + 1) % N
            declare
              v_num_partitions smallint := (select num_partitions from ash.config where singleton);
            begin
            v_target_slot := ((v_slot_before + 1) % v_num_partitions)::smallint;
            declare
              v_truncate_slot smallint := ((v_target_slot + 1) % v_num_partitions)::smallint;
            begin
              -- Seed the partition that will be TRUNCATED
              execute format(
                'insert into ash.sample_%s (sample_ts, datid, active_count, data, slot) values (%s, 1, 1, ''{-1,1,1}'', %s)',
                v_truncate_slot, v_fixture_minute, v_truncate_slot
              );
              execute format(
                'insert into ash.query_map_%s (query_id) values (99999)',
                v_truncate_slot
              );

              -- Verify data exists before rotation
              execute format('select count(*) from ash.sample_%s', v_truncate_slot)
              into v_count;
              assert v_count > 0,
                'sample_' || v_truncate_slot || ' should have data before rotation';

              -- Force rotation
              update ash.config set rotated_at = now() - interval '2 days';
              perform ash.rotate();

              select current_slot into v_slot_after from ash.config;
              assert v_slot_after = v_target_slot,
                'slot should advance to ' || v_target_slot || ', got ' || v_slot_after;

              -- Verify TRUNCATION: truncated sample partition should be empty
              execute format('select count(*) from ash.sample_%s', v_truncate_slot)
              into v_count;
              assert v_count = 0,
                'sample_' || v_truncate_slot || ' should be empty after rotation, has ' || v_count || ' rows';

              -- Verify TRUNCATION: truncated query_map partition should be empty
              execute format('select count(*) from ash.query_map_%s', v_truncate_slot)
              into v_count;
              assert v_count = 0,
                'query_map_' || v_truncate_slot || ' should be empty after rotation, has ' || v_count || ' rows';

              -- Verify identity sequence was reset: next insert should get a low id
              execute format(
                'insert into ash.query_map_%s (query_id) values (88888) returning id',
                v_truncate_slot
              ) into v_next_id;
              assert v_next_id = 1,
                'query_map_' || v_truncate_slot || ' identity should restart at 1, got ' || v_next_id;
            end;
            end;

            raise notice 'Rotation tests PASSED (truncation + sequence reset verified)';
          end;
          $$;
          EOF

