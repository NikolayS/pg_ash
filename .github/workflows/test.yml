name: Test pg_ash

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to least-privilege; this workflow only runs tests against a service
# container and needs no write access to repo contents, issues, or PRs.
permissions:
  contents: read

jobs:

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Guard SQL release workflow
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"

          if printf '%s\n' "$changed" | grep -E '^sql/.*\.sql$' >/dev/null; then
            case "$HEAD_REF:$PR_TITLE" in
              release/*:*|release-*:*|*:release:*)
                ;;
              *)
                echo "Released SQL under sql/ is frozen between releases." >&2
                echo "Feature/fix PRs must stage SQL in devel/sql/ and let a release-stamp PR promote it." >&2
                printf 'Changed released SQL files:\n%s\n' \
                  "$(printf '%s\n' "$changed" | grep -E '^sql/.*\.sql$')" >&2
                exit 1
                ;;
            esac
          fi

      - name: Guard docs against stale privilege and reader names
        run: |
          set -euo pipefail

          if grep -RIn "grant execute on all functions in schema ash" README.md RELEASE_NOTES.md docs; then
            echo "Do not recommend blanket EXECUTE on ash.*; use ash.grant_reader() or explicit minimal grants." >&2
            exit 1
          fi

          # README must document the 2.0 reader surface (breaking rework).
          for fn in "ash.periods" "ash.top" "ash.report"; do
            if ! grep -q "$fn" README.md; then
              echo "README.md must document the 2.0 reader $fn" >&2
              exit 1
            fi
          done

          if ! grep -Fq "Only \`ash.rebuild_partitions\` and \`ash.uninstall\` require the exact \`'yes'\` confirmation token." README.md; then
            echo "README.md must limit the exact 'yes' confirmation contract to rebuild_partitions and uninstall." >&2
            exit 1
          fi
          if grep -Fq "All destructive calls require" README.md; then
            echo "README.md must not claim every destructive operation takes a confirmation token." >&2
            exit 1
          fi

          grep -q "ash.grant_reader" README.md
          grep -q "SECURITY.md#advisory-lock-squat-dos" README.md
          grep -q "SECURITY.md#advisory-lock-squat-dos" RELEASE_NOTES.md
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PG19 is still beta, so the official image tag is 19beta1 until GA.
        postgres: [14, 15, 16, 17, 18, 19beta1]
        # Quoted so YAML doesn't coerce on/off into booleans — GitHub Actions
        # compares these as strings in the step-level `if`/conditionals.
        cron: ["on"]
        # Deliberate no-pg_cron variant (M-CI-4): exercise the degraded-mode
        # branch on a PG version where pg_cron is normally available (PG17),
        # so we catch regressions independent of PGDG package availability.
        include:
          - postgres: 17
            cron: "off"

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pg_cron in container
        # The GitHub Actions `services:` block does not let us mount a custom
        # postgresql.conf or set `command: -c shared_preload_libraries=...` on
        # the existing postgres service. So we `docker exec` into the already-
        # running service container to (1) apt-install pg_cron from PGDG and
        # (2) append `shared_preload_libraries` to postgresql.conf, then
        # `docker restart` so PostgreSQL re-reads the config. Without the
        # restart, pg_cron's background worker never starts.
        # When matrix.cron == 'off', we skip pg_cron install entirely to
        # exercise the degraded-mode (no-cron) branch.
        #
        # NB1/NB2: pass ${{ }} expressions through env: vars rather than
        # textual substitution into bash (CWE-78 hygiene; values are hard-
        # coded today but future edits shouldn't break the pattern).
        env:
          CRON: ${{ matrix.cron }}
          CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          if [ "$CRON" = "off" ]; then
            echo "matrix.cron=off — skipping pg_cron install to test degraded mode"
            docker exec "$CONTAINER_ID" bash -c "
              echo \"shared_preload_libraries = 'pg_stat_statements'\" >> \${PGDATA}/postgresql.conf
            "
            docker restart "$CONTAINER_ID"
            sleep 5
            exit 0
          fi
          # Install pg_cron inside the PostgreSQL container (not on host).
          # Allow apt failures to be non-fatal here — PGDG sometimes lags on
          # new PG majors (e.g. PG19 while still in beta), and we want to
          # still exercise the no-cron branch rather than fail the whole job.
          # The follow-up "Verify pg_cron install matches expectation" step
          # enforces the expected state.
          docker exec "$CONTAINER_ID" bash -c "
            apt-get update && apt-get install -y postgresql-\${PG_MAJOR}-cron
          " || echo "pg_cron install failed — will fall back to no-cron mode"
          # Configure pg_cron (or fall back to pgss-only if install failed).
          # cron.use_background_workers = on makes pg_cron run each scheduled
          # command as a bgworker instead of opening a libpq connection to
          # localhost. That bypasses pg_hba.conf / TCP / username concerns
          # entirely, which has historically been the flakiest part of
          # running pg_cron in a CI service container. Supported since
          # pg_cron 1.5 (PGDG packages are always >= 1.6 now).
          docker exec "$CONTAINER_ID" bash -c "
            if [ -f /usr/share/postgresql/\${PG_MAJOR}/extension/pg_cron.control ]; then
              echo \"shared_preload_libraries = 'pg_cron,pg_stat_statements'\" >> \${PGDATA}/postgresql.conf
              echo 'cron.database_name = postgres' >> \${PGDATA}/postgresql.conf
              echo 'cron.use_background_workers = on' >> \${PGDATA}/postgresql.conf
            else
              echo \"shared_preload_libraries = 'pg_stat_statements'\" >> \${PGDATA}/postgresql.conf
            fi
          "
          docker restart "$CONTAINER_ID"
          sleep 5

      - name: Wait for Postgres
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'

          postgres_ready=false
          for _ in {1..30}; do
            if pg_isready \
              --host=localhost \
              --port=5432 \
              --username=postgres; then
              postgres_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$postgres_ready" != true ]]; then
            printf '%s\n' \
              "Postgres did not become ready after 30 probes" >&2
            exit 1
          fi

      - name: Create pg_cron extension
        env:
          PGPASSWORD: postgres
          CRON: ${{ matrix.cron }}
        run: |
          if [ "$CRON" = "off" ]; then
            echo "matrix.cron=off — not creating pg_cron extension"
          else
            # pg_cron may legitimately be unavailable on new PG majors before
            # PGDG catches up (e.g. PG19 while still in beta). Don't fail the job; downstream
            # cron-gated tests check `pg_extension` and skip themselves.
            psql -h localhost -U postgres -d postgres -c "create extension if not exists pg_cron;" || echo "pg_cron not available (PGDG package missing for this PG major)"

            # Issue #46: pg_cron's scheduler/maintenance threads open a libpq
            # connection back to localhost as the container's OS user (root).
            # Peer auth needs both a matching PG role AND a default database
            # of the same name — otherwise the postgres log fills with
            # `FATAL: role "root" does not exist` or `FATAL: database "root"
            # does not exist`, even though `cron.use_background_workers = on`
            # makes the actual job execution bgworker-based. Provision both
            # so the wiring is clean and H-CI-3 below can assert real firing.
            if psql -h localhost -U postgres -d postgres -tAc "select 1 from pg_extension where extname = 'pg_cron'" | grep -q 1; then
              psql -h localhost -U postgres -d postgres -tAc "select 1 from pg_roles where rolname = 'root'" | grep -q 1 \
                || psql -h localhost -U postgres -d postgres -c "create role root superuser login;"
              psql -h localhost -U postgres -d postgres -tAc "select 1 from pg_database where datname = 'root'" | grep -q 1 \
                || psql -h localhost -U postgres -d postgres -c "create database root owner postgres;"
            fi
          fi
          # pg_stat_statements normally ships with every supported PG version,
          # but PGDG occasionally lags contrib on release day for a brand-new
          # major. NB4: treat pgss the same way we treat pg_cron — warn and
          # continue if creation fails — so a temporarily incomplete PGDG
          # doesn't turn every `cron=on` matrix entry red at setup. Downstream
          # pgss-dependent tests check `pg_extension` themselves and either
          # skip or assert their own error behaviour (see "Degraded mode:
          # without pg_stat_statements").
          psql -h localhost -U postgres -d postgres \
            -c "create extension if not exists pg_stat_statements;" \
            || echo "pg_stat_statements not available (contrib package missing for this PG major)"

      - name: "Verify pg_cron wiring"
        # Upstream-debugging step for H-CI-3: confirm that (a) the
        # shared_preload_libraries edit survived `docker restart`,
        # (b) cron.use_background_workers/cron.database_name took effect,
        # (c) the pg_cron scheduler bgworker actually attached. When
        # H-CI-3 has failed in the past (`baseline=0 after=0 waited=30`
        # with no rows in cron.job_run_details) these three facts were
        # all invisible — this step surfaces them in the job log every
        # run so a future failure pinpoints which link of the chain
        # broke.
        #
        # Non-fatal when matrix.cron=off or pg_cron isn't installed:
        # the degraded-mode axis deliberately has none of this.
        env:
          PGPASSWORD: postgres
          CRON: ${{ matrix.cron }}
        run: |
          if [ "$CRON" = "off" ]; then
            echo "matrix.cron=off — skipping pg_cron wiring verification"
            exit 0
          fi
          if ! psql -h localhost -U postgres -d postgres -tAc \
              "select exists (select from pg_extension where extname='pg_cron')" \
              | grep -q '^t$'; then
            echo "pg_cron extension not installed — skipping wiring verification"
            exit 0
          fi
          echo "=== GUCs ==="
          psql -h localhost -U postgres -d postgres -c "
            show shared_preload_libraries;
            show cron.database_name;
            show cron.use_background_workers;
            show cron.host;
          "
          echo "=== pg_cron extension version ==="
          psql -h localhost -U postgres -d postgres -c \
            "select extname, extversion from pg_extension where extname='pg_cron';"
          echo "=== pg_cron scheduler bgworker attached? ==="
          # When shared_preload_libraries actually loaded pg_cron, the
          # launcher bgworker is always running. If this returns 0 rows,
          # shared_preload_libraries did not include pg_cron at startup
          # (edit didn't survive / got overwritten / restart raced).
          psql -h localhost -U postgres -d postgres -c "
            select application_name, backend_type, state
            from pg_stat_activity
            where backend_type ~* 'cron'
               or application_name ~* 'cron';
          "
          echo "=== ash_* jobs currently scheduled in cron.job ==="
          # This separates "we scheduled jobs" (>0 rows) from "jobs are
          # running" (rows in cron.job_run_details). At this point in the
          # workflow no ash.start() has run yet, so this should be 0 — but
          # we emit the query now so the template is visible in the CI log
          # and later debugging can compare against the post-start state
          # captured in H-CI-3 itself.
          psql -h localhost -U postgres -d postgres -c "
            select count(*) as ash_jobs_scheduled
            from cron.job
            where jobname like 'ash_%';
          "

      - name: Install pg_ash (fresh development install)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$(python3 devel/scripts/ash_sql_chain.py fresh-install-path)"

      - name: Test SQL entrypoints fail atomically
        env:
          PGPASSWORD: postgres
        run: |
          set -Eeuo pipefail
          IFS=$'\n\t'

          psql_base=(
            psql
            --no-psqlrc
            --host=localhost
            --username=postgres
          )
          install_path="$(python3 devel/scripts/ash_sql_chain.py fresh-install-path)"
          failure_log_dir="$(mktemp -d)"
          trap 'rm -rf -- "${failure_log_dir}"' EXIT

          "${psql_base[@]}" --dbname=postgres --set=ON_ERROR_STOP=1 << 'EOF'
          drop database if exists ash_install_failure_test with (force);
          create database ash_install_failure_test;
          drop database if exists ash_atomic_failure_test with (force);
          create database ash_atomic_failure_test;
          EOF

          "${psql_base[@]}" \
            --dbname=ash_install_failure_test \
            --set=ON_ERROR_STOP=1 << 'EOF'
          create schema ash;
          create view ash.config as select true as singleton;
          EOF

          set +e
          "${psql_base[@]}" \
            --dbname=ash_install_failure_test \
            --file="${install_path}" \
            >"${failure_log_dir}/install.log" 2>&1
          install_rc=$?
          set -e
          if (( install_rc != 3 )); then
            cat "${failure_log_dir}/install.log" >&2
            echo "fresh installer exit code: expected 3, got ${install_rc}" >&2
            exit 1
          fi

          "${psql_base[@]}" \
            --dbname=ash_install_failure_test \
            --set=ON_ERROR_STOP=1 << 'EOF'
          do $$
          begin
            assert to_regclass('ash.config') is not null,
              'pre-existing failure fixture must survive rollback';
            assert not exists (
              select from pg_proc as proc
              join pg_namespace as nsp on nsp.oid = proc.pronamespace
              where nsp.nspname = 'ash'
            ), 'failed installer left functions behind';
            assert not exists (
              select from pg_tables where schemaname = 'ash'
            ), 'failed installer left tables behind';
          end $$;
          EOF

          expected_function_count="$(
            "${psql_base[@]}" \
              --dbname=postgres \
              --tuples-only \
              --no-align \
              --command="
                select count(*)
                from pg_proc as proc
                join pg_namespace as nsp on nsp.oid = proc.pronamespace
                where nsp.nspname = 'ash'
              "
          )"
          echo "complete installer function count: ${expected_function_count}"

          "${psql_base[@]}" \
            --dbname=ash_atomic_failure_test \
            --set=ON_ERROR_STOP=1 << 'EOF'
          create function public.fail_ash_rollup_1m()
          returns event_trigger
          language plpgsql
          as $$
          declare
            command record;
          begin
            for command in
              select * from pg_event_trigger_ddl_commands()
            loop
              if command.object_type = 'table'
                 and command.schema_name = 'ash'
                 and command.object_identity = 'ash.rollup_1m' then
                raise exception 'forced mid-install failure at ash.rollup_1m';
              end if;
            end loop;
          end $$;

          create event trigger fail_ash_rollup_1m
            on ddl_command_end
            when tag in ('CREATE TABLE')
            execute function public.fail_ash_rollup_1m();
          EOF

          set +e
          "${psql_base[@]}" \
            --dbname=ash_atomic_failure_test \
            --set=ON_ERROR_STOP=1 \
            --file="${install_path}" \
            >"${failure_log_dir}/atomic.log" 2>&1
          atomic_rc=$?
          set -e
          if (( atomic_rc != 3 )); then
            cat "${failure_log_dir}/atomic.log" >&2
            echo "forced failure exit code: expected 3, got ${atomic_rc}" >&2
            exit 1
          fi
          if ! grep -Fq \
              "forced mid-install failure at ash.rollup_1m" \
              "${failure_log_dir}/atomic.log"; then
            cat "${failure_log_dir}/atomic.log" >&2
            echo "installer did not reach the forced mid-install failure" >&2
            exit 1
          fi

          "${psql_base[@]}" \
            --dbname=ash_atomic_failure_test \
            --set=ON_ERROR_STOP=1 \
            --set=expected_function_count="${expected_function_count}" << 'EOF'
          select set_config(
            'pg_ash.expected_function_count',
            :'expected_function_count',
            false
          );

          do $$
          declare
            surviving_function_count int;
          begin
            select count(*)
            into surviving_function_count
            from pg_proc as proc
            join pg_namespace as nsp on nsp.oid = proc.pronamespace
            where nsp.nspname = 'ash';

            assert to_regnamespace('ash') is null, format(
              'failed installer left a partial ash schema (%s of %s functions survive)',
              surviving_function_count,
              current_setting('pg_ash.expected_function_count')
            );
          end $$;
          EOF

          # A caller's interactive psql configuration must not turn each
          # installer statement into a savepoint and make a partial install
          # committable after the first error.
          printf '\\set ON_ERROR_ROLLBACK on\n\\i %s\ncommit;\n\\q\n' \
            "${install_path}" |
            script --quiet --return \
              --command \
              "psql --no-psqlrc --host=localhost --username=postgres --dbname=ash_atomic_failure_test" \
              /dev/null \
              >"${failure_log_dir}/on-error-rollback.log" 2>&1
          if ! grep -Fq \
              "forced mid-install failure at ash.rollup_1m" \
              "${failure_log_dir}/on-error-rollback.log"; then
            cat "${failure_log_dir}/on-error-rollback.log" >&2
            echo "interactive installer did not reach the forced failure" >&2
            exit 1
          fi

          "${psql_base[@]}" \
            --dbname=ash_atomic_failure_test \
            --set=ON_ERROR_STOP=1 << 'EOF'
          do $$
          begin
            assert to_regnamespace('ash') is null,
              'ON_ERROR_ROLLBACK allowed a partial installer commit';
          end $$;
          EOF

      - name: Test schema and infrastructure
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -v expected_version="$(python3 devel/scripts/ash_sql_chain.py fresh-install-version)" << 'EOF'
          select set_config('pg_ash.expected_version', :'expected_version', false);

          do $$
          begin
            -- Schema exists
            assert exists (select from pg_namespace where nspname = 'ash'),
              'ash schema missing';

            -- Config table initialized with version
            assert (select count(*) from ash.config) = 1,
              'config not initialized';
            assert (select version from ash.config where singleton) = current_setting('pg_ash.expected_version'),
              'version should match latest released version for fresh install';

            -- missed_samples column exists and defaults to 0
            assert exists (
              select from information_schema.columns
              where table_schema = 'ash' and table_name = 'config' and column_name = 'missed_samples'
            ), 'missed_samples column missing from ash.config';
            assert (select missed_samples from ash.config where singleton) = 0,
              'missed_samples should default to 0';

            -- Core tables exist
            assert exists (select from pg_tables where schemaname = 'ash' and tablename = 'wait_event_map'),
              'wait_event_map missing';
            assert exists (select from pg_tables where schemaname = 'ash' and tablename = 'sample'),
              'sample missing';

            -- Partitioned query_map tables
            assert exists (select from pg_tables where schemaname = 'ash' and tablename = 'query_map_0'),
              'query_map_0 missing';
            assert exists (select from pg_tables where schemaname = 'ash' and tablename = 'query_map_1'),
              'query_map_1 missing';
            assert exists (select from pg_tables where schemaname = 'ash' and tablename = 'query_map_2'),
              'query_map_2 missing';

            -- Sample partitions
            assert exists (select from pg_tables where schemaname = 'ash' and tablename = 'sample_0'),
              'sample_0 missing';
            assert exists (select from pg_tables where schemaname = 'ash' and tablename = 'sample_1'),
              'sample_1 missing';
            assert exists (select from pg_tables where schemaname = 'ash' and tablename = 'sample_2'),
              'sample_2 missing';

            -- query_map_all view
            assert exists (select from pg_views where schemaname = 'ash' and viewname = 'query_map_all'),
              'query_map_all view missing';

            -- Core functions exist
            assert exists (select from pg_proc where proname = 'epoch' and pronamespace = 'ash'::regnamespace),
              'epoch() missing';
            assert exists (select from pg_proc where proname = 'current_slot' and pronamespace = 'ash'::regnamespace),
              'current_slot() missing';
            assert exists (select from pg_proc where proname = 'take_sample' and pronamespace = 'ash'::regnamespace),
              'take_sample() missing';
            assert exists (select from pg_proc where proname = 'rotate' and pronamespace = 'ash'::regnamespace),
              'rotate() missing';
            assert exists (select from pg_proc where proname = 'decode_sample' and pronamespace = 'ash'::regnamespace),
              'decode_sample() missing';
            assert exists (select from pg_proc where proname = '_wait_color' and pronamespace = 'ash'::regnamespace),
              '_wait_color() missing';

            raise notice 'Schema and infrastructure tests PASSED';
          end;
          $$;
          EOF

      - name: Test privilege hardening (REVOKE from PUBLIC)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          -- Create an unprivileged role to represent a "random tenant"
          do $$
          begin
            if not exists (select from pg_roles where rolname = 'ash_test_unpriv') then
              create role ash_test_unpriv login password 'x';
            end if;
          end $$;

          do $$
          begin
            -- PUBLIC has no EXECUTE on reader functions
            assert not has_function_privilege('public', 'ash.top(text,timestamptz,timestamptz,text,text,bigint,name,int,interval,text)', 'EXECUTE'),
              'PUBLIC should NOT have EXECUTE on ash.top';
            assert not has_function_privilege('public', 'ash.aas(timestamptz,timestamptz,text,text,bigint,name,interval)', 'EXECUTE'),
              'PUBLIC should NOT have EXECUTE on ash.aas';
            assert not has_function_privilege('public', 'ash.status()', 'EXECUTE'),
              'PUBLIC should NOT have EXECUTE on ash.status';
            assert not has_function_privilege('public', 'ash.samples(timestamptz,timestamptz,int,text,text,bigint,name)', 'EXECUTE'),
              'PUBLIC should NOT have EXECUTE on ash.samples';

            -- PUBLIC has no EXECUTE on admin functions
            assert not has_function_privilege('public', 'ash.start(interval)', 'EXECUTE'),
              'PUBLIC should NOT have EXECUTE on ash.start';
            assert not has_function_privilege('public', 'ash.stop()', 'EXECUTE'),
              'PUBLIC should NOT have EXECUTE on ash.stop';
            assert not has_function_privilege('public', 'ash.rotate()', 'EXECUTE'),
              'PUBLIC should NOT have EXECUTE on ash.rotate';
            assert not has_function_privilege('public', 'ash.take_sample()', 'EXECUTE'),
              'PUBLIC should NOT have EXECUTE on ash.take_sample';
            assert not has_function_privilege('public', 'ash.set_debug_logging(bool)', 'EXECUTE'),
              'PUBLIC should NOT have EXECUTE on ash.set_debug_logging';

            -- PUBLIC has no SELECT on reader tables
            assert not has_table_privilege('public', 'ash.sample', 'SELECT'),
              'PUBLIC should NOT have SELECT on ash.sample';
            assert not has_table_privilege('public', 'ash.config', 'SELECT'),
              'PUBLIC should NOT have SELECT on ash.config';
            assert not has_table_privilege('public', 'ash.wait_event_map', 'SELECT'),
              'PUBLIC should NOT have SELECT on ash.wait_event_map';
            assert not has_table_privilege('public', 'ash.query_map_all', 'SELECT'),
              'PUBLIC should NOT have SELECT on ash.query_map_all';
            assert not has_table_privilege('public', 'ash.sample_0', 'SELECT'),
              'PUBLIC should NOT have SELECT on ash.sample_0';
            assert not has_table_privilege('public', 'ash.query_map_0', 'SELECT'),
              'PUBLIC should NOT have SELECT on ash.query_map_0';

            -- Unprivileged role (non-owner) cannot execute readers either
            assert not has_function_privilege('ash_test_unpriv', 'ash.top(text,timestamptz,timestamptz,text,text,bigint,name,int,interval,text)', 'EXECUTE'),
              'non-owner role should NOT have EXECUTE on ash.top';
            assert not has_function_privilege('ash_test_unpriv', 'ash.aas(timestamptz,timestamptz,text,text,bigint,name,interval)', 'EXECUTE'),
              'non-owner role should NOT have EXECUTE on ash.aas';

            -- Owner (postgres) retains EXECUTE by virtue of ownership
            assert has_function_privilege('postgres', 'ash.top(text,timestamptz,timestamptz,text,text,bigint,name,int,interval,text)', 'EXECUTE'),
              'owner SHOULD have EXECUTE on ash.top';
            assert has_function_privilege('postgres', 'ash.start(interval)', 'EXECUTE'),
              'owner SHOULD have EXECUTE on ash.start';
            assert has_function_privilege('postgres', 'ash.take_sample()', 'EXECUTE'),
              'owner SHOULD have EXECUTE on ash.take_sample';
            assert has_table_privilege('postgres', 'ash.sample', 'SELECT'),
              'owner SHOULD have SELECT on ash.sample';

            raise notice 'Privilege hardening tests PASSED';
          end;
          $$;

          -- Behavioral check: call as the unprivileged role, expect 42501
          set role ash_test_unpriv;
          do $$
          begin
            begin
              perform * from ash.top('wait_event', now() - interval '1 hour', now());
              raise exception 'expected permission denied, but call succeeded';
            exception when insufficient_privilege then
              -- expected path
              null;
            end;
          end;
          $$;
          reset role;

          -- GRANT flow smoke-test: owner can hand out EXECUTE, then REVOKE it
          grant execute on function ash.top(text,timestamptz,timestamptz,text,text,bigint,name,int,interval,text) to ash_test_unpriv;
          do $$
          begin
            assert has_function_privilege('ash_test_unpriv', 'ash.top(text,timestamptz,timestamptz,text,text,bigint,name,int,interval,text)', 'EXECUTE'),
              'GRANT to non-owner role should succeed';
          end $$;
          revoke execute on function ash.top(text,timestamptz,timestamptz,text,text,bigint,name,int,interval,text) from ash_test_unpriv;
          do $$
          begin
            assert not has_function_privilege('ash_test_unpriv', 'ash.top(text,timestamptz,timestamptz,text,text,bigint,name,int,interval,text)', 'EXECUTE'),
              'REVOKE from non-owner role should succeed';
          end $$;

          drop role ash_test_unpriv;
          EOF

      - name: Test ash.grant_reader / ash.revoke_reader helpers (#52)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          -- Set up: a monitoring-style role with no privileges yet.
          do $$
          begin
            if not exists (select from pg_roles where rolname = 'ash_grafana') then
              create role ash_grafana login password 'x';
            end if;
          end $$;

          -- Sanity: role cannot use schema ash before grant_reader.
          do $$
          begin
            assert not has_schema_privilege('ash_grafana', 'ash', 'USAGE'),
              'ash_grafana must NOT have USAGE on ash before grant_reader';
            assert not has_function_privilege('ash_grafana', 'ash.top(text,timestamptz,timestamptz,text,text,bigint,name,int,interval,text)', 'EXECUTE'),
              'ash_grafana must NOT have EXECUTE on ash.top before grant_reader';
            assert not has_function_privilege('ash_grafana', 'ash.status()', 'EXECUTE'),
              'ash_grafana must NOT have EXECUTE on ash.status before grant_reader';
            assert not has_function_privilege('ash_grafana', 'ash.timeline(timestamptz,timestamptz,interval,text,text,bigint,name)', 'EXECUTE'),
              'ash_grafana must NOT have EXECUTE on ash.timeline before grant_reader';
            assert not has_table_privilege('ash_grafana', 'ash.sample', 'SELECT'),
              'ash_grafana must NOT have SELECT on ash.sample before grant_reader';
            assert not has_table_privilege('ash_grafana', 'ash.rollup_1m', 'SELECT'),
              'ash_grafana must NOT have SELECT on ash.rollup_1m before grant_reader';
            assert not has_table_privilege('ash_grafana', 'ash.sample_0', 'SELECT'),
              'ash_grafana must NOT have SELECT on ash.sample_0 before grant_reader';
          end $$;

          -- Validation: non-existent role must raise a clear error and not partial-grant.
          do $$
          declare
            v_succeeded bool := false;
          begin
            begin
              perform ash.grant_reader('nope_does_not_exist');
              v_succeeded := true;
            exception when raise_exception then
              null; -- expected: function raised because role missing
            end;
            assert not v_succeeded,
              'grant_reader must reject non-existent role';
          end $$;

          -- GRANT: hand out the reader bundle.
          select ash.grant_reader('ash_grafana');

          -- Verify the granted set.
          do $$
          begin
            assert has_schema_privilege('ash_grafana', 'ash', 'USAGE'),
              'grant_reader: ash_grafana must have USAGE on ash';

            -- Reader functions across the family
            assert has_function_privilege('ash_grafana', 'ash.top(text,timestamptz,timestamptz,text,text,bigint,name,int,interval,text)', 'EXECUTE'),
              'grant_reader: ash.top must be EXECUTE-able';
            assert has_function_privilege('ash_grafana', 'ash.aas(timestamptz,timestamptz,text,text,bigint,name,interval)', 'EXECUTE'),
              'grant_reader: ash.aas must be EXECUTE-able';
            assert has_function_privilege('ash_grafana', 'ash.status()', 'EXECUTE'),
              'grant_reader: ash.status must be EXECUTE-able';
            assert has_function_privilege('ash_grafana', 'ash.samples(timestamptz,timestamptz,int,text,text,bigint,name)', 'EXECUTE'),
              'grant_reader: ash.samples must be EXECUTE-able';
            assert has_function_privilege('ash_grafana', 'ash.timeline(timestamptz,timestamptz,interval,text,text,bigint,name)', 'EXECUTE'),
              'grant_reader: ash.timeline must be EXECUTE-able';
            assert has_function_privilege('ash_grafana', 'ash.report(timestamptz,timestamptz,int,int)', 'EXECUTE'),
              'grant_reader: ash.report must be EXECUTE-able';
            assert has_function_privilege('ash_grafana', 'ash.periods(timestamptz)', 'EXECUTE'),
              'grant_reader: ash.periods must be EXECUTE-able';
            assert has_function_privilege('ash_grafana', 'ash.summary(timestamptz,timestamptz)', 'EXECUTE'),
              'grant_reader: ash.summary must be EXECUTE-able';
            assert has_function_privilege('ash_grafana', 'ash.chart(timestamptz,timestamptz,interval,int,int,boolean)', 'EXECUTE'),
              'grant_reader: ash.chart must be EXECUTE-able';

            -- Reader-helpers the readers depend on
            assert has_function_privilege('ash_grafana', 'ash._active_slots()', 'EXECUTE'),
              'grant_reader: ash._active_slots must be EXECUTE-able';
            assert has_function_privilege('ash_grafana', 'ash._wait_color(text,boolean)', 'EXECUTE'),
              'grant_reader: ash._wait_color must be EXECUTE-able';
            assert has_function_privilege('ash_grafana', 'ash.epoch()', 'EXECUTE'),
              'grant_reader: ash.epoch must be EXECUTE-able';

            -- Admin functions stay locked down
            assert not has_function_privilege('ash_grafana', 'ash.start(interval)', 'EXECUTE'),
              'grant_reader: ash.start must remain admin-only';
            assert not has_function_privilege('ash_grafana', 'ash.stop()', 'EXECUTE'),
              'grant_reader: ash.stop must remain admin-only';
            assert not has_function_privilege('ash_grafana', 'ash.take_sample()', 'EXECUTE'),
              'grant_reader: ash.take_sample must remain admin-only';
            assert not has_function_privilege('ash_grafana', 'ash.rotate()', 'EXECUTE'),
              'grant_reader: ash.rotate must remain admin-only';
            assert not has_function_privilege('ash_grafana', 'ash.uninstall(text)', 'EXECUTE'),
              'grant_reader: ash.uninstall must remain admin-only';
            assert not has_function_privilege('ash_grafana', 'ash.set_debug_logging(bool)', 'EXECUTE'),
              'grant_reader: ash.set_debug_logging must remain admin-only';
            assert not has_function_privilege('ash_grafana', 'ash.rollup_minute(int)', 'EXECUTE'),
              'grant_reader: ash.rollup_minute must remain admin-only';
            assert not has_function_privilege('ash_grafana', 'ash.rollup_hour()', 'EXECUTE'),
              'grant_reader: ash.rollup_hour must remain admin-only';
            assert not has_function_privilege('ash_grafana', 'ash.rollup_cleanup()', 'EXECUTE'),
              'grant_reader: ash.rollup_cleanup must remain admin-only';
            -- The helpers themselves are admin-only too: a reader role
            -- that could grant_reader/revoke_reader could escalate.
            assert not has_function_privilege('ash_grafana', 'ash.grant_reader(name)', 'EXECUTE'),
              'grant_reader: ash.grant_reader must remain admin-only';
            assert not has_function_privilege('ash_grafana', 'ash.revoke_reader(name)', 'EXECUTE'),
              'grant_reader: ash.revoke_reader must remain admin-only';

            -- Reader tables
            assert has_table_privilege('ash_grafana', 'ash.sample', 'SELECT'),
              'grant_reader: SELECT on ash.sample';
            assert has_table_privilege('ash_grafana', 'ash.query_map_all', 'SELECT'),
              'grant_reader: SELECT on ash.query_map_all';
            assert has_table_privilege('ash_grafana', 'ash.config', 'SELECT'),
              'grant_reader: SELECT on ash.config';
            assert has_table_privilege('ash_grafana', 'ash.wait_event_map', 'SELECT'),
              'grant_reader: SELECT on ash.wait_event_map';
            assert has_table_privilege('ash_grafana', 'ash.rollup_1m', 'SELECT'),
              'grant_reader: SELECT on ash.rollup_1m';
            assert has_table_privilege('ash_grafana', 'ash.rollup_1h', 'SELECT'),
              'grant_reader: SELECT on ash.rollup_1h';

            -- Per-slot partitions get SELECT (parent grants do not cascade in PG)
            assert has_table_privilege('ash_grafana', 'ash.sample_0', 'SELECT'),
              'grant_reader: SELECT on ash.sample_0 (partition)';
            assert has_table_privilege('ash_grafana', 'ash.query_map_0', 'SELECT'),
              'grant_reader: SELECT on ash.query_map_0 (dictionary)';

            raise notice 'grant_reader granted set verified';
          end $$;

          -- Idempotency: second grant_reader is a no-op error-free.
          select ash.grant_reader('ash_grafana');

          -- Behavioral check: actually call a reader as the role.
          -- Avoid ash.status() here: it reads cron.job when pg_cron is
          -- loaded, which requires USAGE on schema cron — out of scope
          -- for grant_reader (and a separate, pre-existing limitation).
          set role ash_grafana;
          select count(*) from ash.top('wait_event', now() - interval '1 hour', now());
          select count(*) from ash.timeline(now() - interval '1 hour', now());
          -- direct table read works too
          do $$ begin perform 1 from ash.sample limit 1; end $$;
          reset role;

          -- REVOKE: take everything back.
          select ash.revoke_reader('ash_grafana');

          do $$
          begin
            assert not has_schema_privilege('ash_grafana', 'ash', 'USAGE'),
              'revoke_reader: USAGE on ash must be revoked';
            assert not has_function_privilege('ash_grafana', 'ash.top(text,timestamptz,timestamptz,text,text,bigint,name,int,interval,text)', 'EXECUTE'),
              'revoke_reader: EXECUTE on ash.top must be revoked';
            assert not has_function_privilege('ash_grafana', 'ash.status()', 'EXECUTE'),
              'revoke_reader: EXECUTE on ash.status must be revoked';
            assert not has_function_privilege('ash_grafana', 'ash.timeline(timestamptz,timestamptz,interval,text,text,bigint,name)', 'EXECUTE'),
              'revoke_reader: EXECUTE on ash.timeline must be revoked';
            assert not has_table_privilege('ash_grafana', 'ash.sample', 'SELECT'),
              'revoke_reader: SELECT on ash.sample must be revoked';
            assert not has_table_privilege('ash_grafana', 'ash.rollup_1m', 'SELECT'),
              'revoke_reader: SELECT on ash.rollup_1m must be revoked';
            assert not has_table_privilege('ash_grafana', 'ash.sample_0', 'SELECT'),
              'revoke_reader: SELECT on ash.sample_0 must be revoked';

            raise notice 'revoke_reader fully removed reader privileges';
          end $$;

          -- After revoke, calling a reader as the role must fail with 42501.
          set role ash_grafana;
          do $$
          declare
            v_succeeded bool := false;
          begin
            begin
              perform * from ash.top('wait_event', now() - interval '1 hour', now());
              v_succeeded := true;
            exception when insufficient_privilege then
              null; -- expected: 42501 permission denied
            end;
            assert not v_succeeded,
              'expected permission denied after revoke_reader, got success';
          end $$;
          reset role;

          -- Idempotency: second revoke_reader is a no-op.
          select ash.revoke_reader('ash_grafana');

          -- Sanity: ash._admin_funcs() returns the canonical admin set
          -- (single source of truth for grant_reader/revoke_reader and the
          -- REVOKE-from-PUBLIC hardening block).
          do $$
          begin
            assert array_length(ash._admin_funcs(), 1) > 10,
              'ash._admin_funcs() must return a non-trivial admin list';
            -- Spot-check a few canonical entries to catch accidental drift.
            assert 'start' = any(ash._admin_funcs()),
              'ash._admin_funcs() must include start';
            assert 'take_sample' = any(ash._admin_funcs()),
              'ash._admin_funcs() must include take_sample';
            assert 'grant_reader' = any(ash._admin_funcs()),
              'ash._admin_funcs() must include grant_reader';
          end $$;

          drop role ash_grafana;
          EOF

      - name: "Test 2.0: pg_monitor gets reader access by default (opt-out via revoke_reader)"
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          -- 2.0 installs grant the reader bundle to pg_monitor by default:
          -- its members already hold pg_read_all_stats et al. and can read
          -- the sources pg_ash samples from, so monitoring tools running as
          -- pg_monitor members work out of the box. Opt-out is
          -- ash.revoke_reader('pg_monitor').
          do $$
          begin
            assert has_schema_privilege('pg_monitor', 'ash', 'USAGE'),
              'default grant: pg_monitor must have USAGE on schema ash';
            assert has_function_privilege('pg_monitor', 'ash.aas(timestamptz,timestamptz,text,text,bigint,name,interval)', 'EXECUTE'),
              'default grant: pg_monitor must have EXECUTE on ash.aas';
            assert has_function_privilege('pg_monitor', 'ash.top(text,timestamptz,timestamptz,text,text,bigint,name,int,interval,text)', 'EXECUTE'),
              'default grant: pg_monitor must have EXECUTE on ash.top';
            assert has_table_privilege('pg_monitor', 'ash.sample', 'SELECT'),
              'default grant: pg_monitor must have SELECT on ash.sample';
            -- Admin surface must NOT be part of the default grant.
            assert not has_function_privilege('pg_monitor', 'ash.start(interval)', 'EXECUTE'),
              'default grant: ash.start must remain admin-only';
            assert not has_function_privilege('pg_monitor', 'ash.grant_reader(name)', 'EXECUTE'),
              'default grant: ash.grant_reader must remain admin-only';
          end $$;

          -- Behavioral: a MEMBER of pg_monitor can call the readers.
          do $$
          begin
            if not exists (select from pg_roles where rolname = 'ash_pgmon_member') then
              create role ash_pgmon_member login password 'x';
            end if;
          end $$;
          grant pg_monitor to ash_pgmon_member;

          set role ash_pgmon_member;
          select count(*) from ash.aas();
          select count(*) from ash.top('wait_event', now() - interval '1 hour', now());
          select count(*) from ash.timeline(now() - interval '1 hour', now());
          do $$ begin perform 1 from ash.sample limit 1; end $$;
          reset role;

          -- A bare role that is NOT a pg_monitor member stays locked out.
          do $$
          begin
            if not exists (select from pg_roles where rolname = 'ash_pgmon_outsider') then
              create role ash_pgmon_outsider login password 'x';
            end if;
          end $$;
          set role ash_pgmon_outsider;
          do $$
          declare
            v_succeeded bool := false;
          begin
            begin
              perform * from ash.aas();
              v_succeeded := true;
            exception when insufficient_privilege then
              null; -- expected: 42501 permission denied
            end;
            assert not v_succeeded,
              'non-member must not inherit the default pg_monitor grant';
          end $$;
          reset role;

          -- Opt-out: revoke_reader('pg_monitor') locks the member out again.
          select ash.revoke_reader('pg_monitor');
          set role ash_pgmon_member;
          do $$
          declare
            v_succeeded bool := false;
          begin
            begin
              perform * from ash.aas();
              v_succeeded := true;
            exception when insufficient_privilege then
              null; -- expected after opt-out
            end;
            assert not v_succeeded,
              'pg_monitor member must be denied after revoke_reader(pg_monitor)';
          end $$;
          reset role;

          -- Opt back in restores access (and the default state for the
          -- remaining test steps, which run against this same install).
          select ash.grant_reader('pg_monitor');
          set role ash_pgmon_member;
          select count(*) from ash.aas();
          reset role;

          drop role ash_pgmon_member;
          drop role ash_pgmon_outsider;
          EOF

      - name: "Issue #164: rebuild_partitions preserves reader ACLs"
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          do $$
          begin
            if not exists (
              select from pg_roles where rolname = 'ash_b4_reader'
            ) then
              create role ash_b4_reader login password 'x';
            end if;
            if not exists (
              select from pg_roles where rolname = 'ash_b4_pgmon_member'
            ) then
              create role ash_b4_pgmon_member login password 'x';
            end if;
          end $$;

          grant pg_monitor to ash_b4_pgmon_member;
          select ash.grant_reader('ash_b4_reader');

          -- Seed one exact query-map-backed row before the rebuild. This proves
          -- both a configured reader and a plain pg_monitor member can traverse
          -- query_map_all; the member itself has no direct ash ACL.
          do $$
          declare
            v_wait_id smallint;
            v_map_id int4;
            v_datid oid;
          begin
            truncate ash.sample, ash.query_map_0, ash.query_map_1, ash.query_map_2
              restart identity;
            update ash.config
            set current_slot = 0,
              sampling_enabled = true
            where singleton;

            select ash._register_wait('active', 'B4Test', 'B4Wait')
              into v_wait_id;
            insert into ash.query_map_0 (query_id)
            values (164000000001)
            returning id into v_map_id;
            select oid into v_datid
            from pg_database
            where datname = current_database();
            insert into ash.sample (
              sample_ts,
              datid,
              active_count,
              data,
              slot
            )
            values (
              ash.ts_from_timestamptz(
                date_trunc('minute', now()) - interval '2 minutes'
              ),
              v_datid,
              1,
              array[-v_wait_id, 1, v_map_id]::integer[],
              0
            );
          end $$;

          select
            'before rebuild' as phase,
            rel.relname,
            rel.relacl,
            aclcontains(
              rel.relacl,
              makeaclitem(reader_role.oid, rel.relowner, 'SELECT', false)
            ) as custom_direct,
            aclcontains(
              rel.relacl,
              makeaclitem(pg_monitor.oid, rel.relowner, 'SELECT', false)
            ) as pg_monitor_direct,
            coalesce(
              aclcontains(
                rel.relacl,
                makeaclitem(member_role.oid, rel.relowner, 'SELECT', false)
              ),
              false
            ) as member_direct
          from pg_class as rel
          join pg_namespace as nsp on nsp.oid = rel.relnamespace
          cross join pg_roles as reader_role
          cross join pg_roles as pg_monitor
          cross join pg_roles as member_role
          where nsp.nspname = 'ash'
            and rel.relname in ('query_map_all', 'query_map_0', 'sample_0')
            and reader_role.rolname = 'ash_b4_reader'
            and pg_monitor.rolname = 'pg_monitor'
            and member_role.rolname = 'ash_b4_pgmon_member'
          order by rel.relname;

          do $$
          declare
            v_direct_acl_count int;
            v_member_acl_count int;
          begin
            select count(*) into v_direct_acl_count
            from pg_class as rel
            join pg_namespace as nsp on nsp.oid = rel.relnamespace
            cross join pg_roles as grantee_role
            where nsp.nspname = 'ash'
              and rel.relname in ('query_map_all', 'query_map_0', 'sample_0')
              and grantee_role.rolname in ('ash_b4_reader', 'pg_monitor')
              and coalesce(
                aclcontains(
                  rel.relacl,
                  makeaclitem(
                    grantee_role.oid,
                    rel.relowner,
                    'SELECT',
                    false
                  )
                ),
                false
              );
            assert v_direct_acl_count = 6,
              format(
                '#164: expected 6 direct reader ACLs before rebuild, got %s',
                v_direct_acl_count
              );

            select count(*) into v_member_acl_count
            from pg_class as rel
            join pg_namespace as nsp on nsp.oid = rel.relnamespace
            cross join pg_roles as member_role
            where nsp.nspname = 'ash'
              and rel.relname in ('query_map_all', 'query_map_0', 'sample_0')
              and member_role.rolname = 'ash_b4_pgmon_member'
              and coalesce(
                aclcontains(
                  rel.relacl,
                  makeaclitem(
                    member_role.oid,
                    rel.relowner,
                    'SELECT',
                    false
                  )
                ),
                false
              );
            assert v_member_acl_count = 0,
              format(
                '#164: pg_monitor member must have 0 direct ACLs, got %s',
                v_member_acl_count
              );
          end $$;

          set role ash_b4_reader;
          do $$
          declare
            v_keys text[];
          begin
            select coalesce(array_agg(key order by key), '{}'::text[])
              into v_keys
            from ash.top(
              'query_id',
              now() - interval '10 minutes',
              now() + interval '1 minute'
            );
            assert v_keys = array['164000000001'],
              format(
                '#164: custom reader pre-rebuild keys expected {164000000001}, got %s',
                v_keys
              );
          end $$;
          reset role;

          set role ash_b4_pgmon_member;
          do $$
          declare
            v_keys text[];
          begin
            select coalesce(array_agg(key order by key), '{}'::text[])
              into v_keys
            from ash.top(
              'query_id',
              now() - interval '10 minutes',
              now() + interval '1 minute'
            );
            assert v_keys = array['164000000001'],
              format(
                '#164: pg_monitor member pre-rebuild keys expected {164000000001}, got %s',
                v_keys
              );
          end $$;
          reset role;

          select ash.rebuild_partitions(6, 'yes');

          -- The broken implementation passes this empty-storage smoke test.
          -- The permission failure is delayed until a query-map-backed sample
          -- makes the reader traverse the recreated query_map_all view.
          set role ash_b4_reader;
          do $$
          declare
            v_keys text[];
          begin
            select coalesce(array_agg(key order by key), '{}'::text[])
              into v_keys
            from ash.top(
              'query_id',
              now() - interval '10 minutes',
              now() + interval '1 minute'
            );
            assert v_keys = '{}'::text[],
              format(
                '#164: immediate custom-reader keys expected {}, got %s',
                v_keys
              );
          end $$;
          reset role;

          set role ash_b4_pgmon_member;
          do $$
