      - name: "Test all interval formats (issue #2)"
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          select case
                   when exists (
                     select from pg_extension where extname = 'pg_cron'
                   ) then 'true'
                   else 'false'
                 end as has_pgcron \gset
          \if :has_pgcron
            -- Simulate an existing installation whose job still has the old
            -- unsafe schedule, then prove installer re-apply migrates it.
            create temp table _legacy_hourly_job (jobid bigint primary key);
            insert into _legacy_hourly_job
            select cron.schedule(
              'ash_rollup_1h', '0 * * * *', 'select ash.rollup_hour()'
            );
            select cron.alter_job(
              job_id := (select jobid from _legacy_hourly_job),
              active := false
            );
            \i sql/ash-install.sql
            do $migration$
            declare
              v_job_id bigint;
              v_schedule text;
              v_command text;
              v_active bool;
            begin
              select jobid, schedule, command, active
              into v_job_id, v_schedule, v_command, v_active
              from cron.job
              where jobname = 'ash_rollup_1h';
              assert v_job_id = (select jobid from _legacy_hourly_job),
                'installer re-apply replaced the existing hourly job';
              assert v_schedule = '1 * * * *',
                'installer re-apply must migrate hourly rollup to minute 1, '
                'got: ' || v_schedule;
              assert v_command = 'select ash.rollup_hour()',
                'installer re-apply changed the hourly command';
              assert not v_active,
                'installer re-apply reactivated the disabled hourly job';
            end
            $migration$;
          \endif

          do $$
          declare
            v_job_id bigint;
            v_schedule text;
            v_has_pgcron boolean;
          begin
            -- Skip cron schedule tests if pg_cron not available (e.g., PG19 beta)
            select exists (select from pg_extension where extname = 'pg_cron') into v_has_pgcron;
            if not v_has_pgcron then
              -- Just verify start() works without pg_cron (no error)
              perform ash.start('1 second');
              perform ash.start('5 minutes');
              perform ash.start('2 hours');
              perform ash.stop();
              raise notice 'pg_cron not available — interval schedule tests skipped (pg_cron-optional path verified)';
              return;
            end if;

            perform ash.stop();

            -- Test 1-59 seconds range
            select job_id into v_job_id
            from ash.start('1 second')
            where job_type = 'sampler';
            assert v_job_id is not null, '1 second should work';
            select schedule into v_schedule from cron.job where jobid = v_job_id;
            assert v_schedule = '1 seconds', '1 second should be 1 seconds, got: ' || v_schedule;
            select schedule into v_schedule
            from cron.job
            where jobname = 'ash_rollup_1h';
            assert v_schedule = '1 * * * *',
              'hourly rollup should run at minute 1, got: ' || v_schedule;
            perform ash.stop();

            select job_id into v_job_id
            from ash.start('59 seconds')
            where job_type = 'sampler';
            assert v_job_id is not null, '59 seconds should work';
            select schedule into v_schedule from cron.job where jobid = v_job_id;
            assert v_schedule = '59 seconds', '59 seconds should be 59 seconds, got: ' || v_schedule;
            perform ash.stop();

            -- Test boundary: 60 seconds = 1 minute (cron format)
            select job_id into v_job_id
            from ash.start('60 seconds')
            where job_type = 'sampler';
            assert v_job_id is not null, '60 seconds should work as 1 minute';
            select schedule into v_schedule from cron.job where jobid = v_job_id;
            assert v_schedule = '*/1 * * * *', '60 seconds should be */1 * * * *, got: ' || v_schedule;
            perform ash.stop();

            -- Test 1-59 minutes range
            select job_id into v_job_id
            from ash.start('1 minute')
            where job_type = 'sampler';
            assert v_job_id is not null, '1 minute should work';
            select schedule into v_schedule from cron.job where jobid = v_job_id;
            assert v_schedule = '*/1 * * * *', '1 minute should be */1 * * * *, got: ' || v_schedule;
            perform ash.stop();

            select job_id into v_job_id
            from ash.start('5 minutes')
            where job_type = 'sampler';
            assert v_job_id is not null, '5 minutes should work';
            select schedule into v_schedule from cron.job where jobid = v_job_id;
            assert v_schedule = '*/5 * * * *', '5 minutes should be */5 * * * *, got: ' || v_schedule;
            perform ash.stop();

            select job_id into v_job_id
            from ash.start('59 minutes')
            where job_type = 'sampler';
            assert v_job_id is not null, '59 minutes should work';
            select schedule into v_schedule from cron.job where jobid = v_job_id;
            assert v_schedule = '*/59 * * * *', '59 minutes should be */59 * * * *, got: ' || v_schedule;
            perform ash.stop();

            -- Test boundary: 60 minutes = 1 hour (cron format)
            select job_id into v_job_id
            from ash.start('60 minutes')
            where job_type = 'sampler';
            assert v_job_id is not null, '60 minutes should work as 1 hour';
            select schedule into v_schedule from cron.job where jobid = v_job_id;
            assert v_schedule = '0 * * * *', '60 minutes should be 0 * * * *, got: ' || v_schedule;
            perform ash.stop();

            -- Test 1+ hours range
            select job_id into v_job_id
            from ash.start('1 hour')
            where job_type = 'sampler';
            assert v_job_id is not null, '1 hour should work';
            select schedule into v_schedule from cron.job where jobid = v_job_id;
            assert v_schedule = '0 * * * *', '1 hour should be 0 * * * *, got: ' || v_schedule;
            perform ash.stop();

            select job_id into v_job_id
            from ash.start('2 hours')
            where job_type = 'sampler';
            assert v_job_id is not null, '2 hours should work';
            select schedule into v_schedule from cron.job where jobid = v_job_id;
            assert v_schedule = '0 */2 * * *', '2 hours should be 0 */2 * * *, got: ' || v_schedule;
            perform ash.stop();

            -- Test 23 hours (maximum allowed)
            select job_id into v_job_id
            from ash.start('23 hours')
            where job_type = 'sampler';
            assert v_job_id is not null, '23 hours should work';
            select schedule into v_schedule from cron.job where jobid = v_job_id;
            assert v_schedule = '0 */23 * * *', '23 hours should be 0 */23 * * *, got: ' || v_schedule;
            perform ash.stop();

            -- Test 24 hours should ERROR (exceeds 23h limit)
            declare
              v_error_msg text;
            begin
              select status into v_error_msg
              from ash.start('24 hours')
              where job_type = 'error';
              assert v_error_msg like '%23 hours%', '24 hours should error with 23 hours limit, got: ' || v_error_msg;
            end;

            -- Test error case: non-round interval
            declare
              v_error_msg text;
            begin
              select status into v_error_msg
              from ash.start('90 seconds')
              where job_type = 'error';
              assert v_error_msg like '%exact minutes%', '90 seconds should error, got: ' || v_error_msg;
            end;

            raise notice 'All interval format tests PASSED';
          end;
          $$;
          EOF

      - name: "Test 2.0 reader API (behavioral)"
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          -- ============================================================================
          -- 2.0 reader API — deterministic seed + behavioral assertions.
          -- One raw sample row per (minute, datid); sample_interval pinned to 1s so
          -- AAS = backend-count / window-seconds. Window W = [m0, m0+300) over minutes
          -- m0..m4 anchored 20 minutes back (complete minutes, inside raw+rollup
          -- retention). Every expected avg/peak/p99/backend_seconds below is computed by
          -- hand from the seeded counts (see comments).
          -- ============================================================================
          update ash.config
            set current_slot = 0, sample_interval = '1 second',
                last_rollup_1m_ts = null, last_rollup_1h_ts = null
            where singleton;
          truncate ash.sample_0, ash.sample_1, ash.sample_2;
          truncate ash.query_map_0, ash.query_map_1, ash.query_map_2;
          truncate ash.rollup_1m, ash.rollup_1h;
          alter table ash.query_map_0 alter column id restart;

          drop table if exists t2anchor;
          create temp table t2anchor as
            select ((ash.ts_from_timestamptz(date_trunc('minute', now() - interval '20 minutes'))) / 60) * 60 as base_ts;

          insert into ash.wait_event_map (state, type, event) values
            ('active', 'CPU*', 'CPU*'),
            ('active', 'IO', 'DataFileRead'),
            ('active', 'Lock', 'tuple'),
            ('active', 'LWLock', 'WALWrite')
          on conflict do nothing;

          insert into ash.query_map_0 (query_id) values (111111), (222222), (333333)
          on conflict do nothing;

          do $$
          declare
            v_cpu smallint; v_io smallint; v_lock smallint;
            v_q1 int4; v_q2 int4; v_q3 int4;
            v_base int4; v_dp oid; v_dt oid;
            v_normal integer[];
          begin
            select id into v_cpu  from ash.wait_event_map where type='CPU*' and event='CPU*';
            select id into v_io   from ash.wait_event_map where type='IO' and event='DataFileRead';
            select id into v_lock from ash.wait_event_map where type='Lock' and event='tuple';
            select id into v_q1 from ash.query_map_0 where query_id=111111;
            select id into v_q2 from ash.query_map_0 where query_id=222222;
            select id into v_q3 from ash.query_map_0 where query_id=333333;
            select base_ts into v_base from t2anchor;
            select oid into v_dp from pg_database where datname='postgres';
            select oid into v_dt from pg_database where datname='template1';

            -- Baseline minute (postgres): IO 6 (q1x3,q2x2,q3x1) + CPU 3 (unknown) = 9.
            v_normal := array[-v_io, 6, v_q1,v_q1,v_q1,v_q2,v_q2,v_q3, -v_cpu, 3, 0,0,0]::integer[];
            insert into ash.sample (sample_ts, datid, active_count, data, slot) values
              (v_base + 0,   v_dp, 9, v_normal, 0),
              (v_base + 60,  v_dp, 9, v_normal, 0),
              (v_base + 180, v_dp, 9, v_normal, 0),
              (v_base + 240, v_dp, 9, v_normal, 0);

            -- Spike minute m2 (postgres): IO 12 (q1x6,q2x4,q3x2) + CPU 3 + Lock 6 (q1x6) = 21.
            insert into ash.sample (sample_ts, datid, active_count, data, slot) values
              (v_base + 120, v_dp, 21,
                array[-v_io, 12, v_q1,v_q1,v_q1,v_q1,v_q1,v_q1,v_q2,v_q2,v_q2,v_q2,v_q3,v_q3,
                      -v_cpu, 3, 0,0,0,
                      -v_lock, 6, v_q1,v_q1,v_q1,v_q1,v_q1,v_q1]::integer[], 0);

            -- Spike minute m2 (template1): IO 3 (q1x3) — the second database.
            insert into ash.sample (sample_ts, datid, active_count, data, slot) values
              (v_base + 120, v_dt, 3, array[-v_io, 3, v_q1,v_q1,v_q1]::integer[], 0);
          end $$;

          -- Derive rollups from raw (keeps raw and rollup_1m consistent for report/periods).
          select ash.rollup_minute();

          -- --- ash.aas (scalar summary, raw source) -----------------------------------
          do $$
          declare a record; v_from timestamptz; v_to timestamptz;
          begin
            select ash.ts_to_timestamptz(base_ts), ash.ts_to_timestamptz(base_ts + 300)
              into v_from, v_to from t2anchor;

            -- overall: sum backend-rows = 60 over 300s. avg 0.20; per-min buckets
            -- [9,9,24,9,9]/60 = [.15,.15,.40,.15,.15] -> peak .40, p99 .39.
            select * into a from ash.aas(v_from, v_to);
            assert a.source = 'raw', 'aas source expected raw, got ' || a.source;
            assert a.buckets_expected = 5, 'aas buckets_expected 5, got ' || a.buckets_expected;
            assert a.buckets_with_data = 5, 'aas buckets_with_data 5, got ' || a.buckets_with_data;
            assert a.avg_aas = 0.20, 'aas avg_aas 0.20, got ' || a.avg_aas;
            assert a.peak_aas = 0.40, 'aas peak_aas 0.40, got ' || a.peak_aas;
            assert a.p99_aas = 0.39, 'aas p99_aas 0.39, got ' || a.p99_aas;
            assert a.backend_seconds = 60.00, 'aas backend_seconds 60, got ' || a.backend_seconds;

            -- leaf: ash.aas(wait_event => 'IO:DataFileRead'). IO rows = 39.
            select * into a from ash.aas(v_from, v_to, wait_event => 'IO:DataFileRead');
            assert a.avg_aas = 0.13, 'aas IO avg 0.13, got ' || a.avg_aas;
            assert a.peak_aas = 0.25, 'aas IO peak 0.25, got ' || a.peak_aas;
            assert a.p99_aas = 0.24, 'aas IO p99 0.24, got ' || a.p99_aas;
            assert a.backend_seconds = 39.00, 'aas IO backend_seconds 39, got ' || a.backend_seconds;
            raise notice 'ash.aas PASSED';
          end $$;

          -- --- ash.top (all dimensions + leaf drill) ----------------------------------
          do $$
          declare r record; v_from timestamptz; v_to timestamptz; n int;
          begin
            select ash.ts_to_timestamptz(base_ts), ash.ts_to_timestamptz(base_ts + 300)
              into v_from, v_to from t2anchor;

            -- wait_event_type: IO 39 (pct 65), CPU* 15 (25), Lock 6 (10). Total 60.
            select * into r from ash.top('wait_event_type', v_from, v_to) where key = 'IO';
            assert r.avg_aas = 0.13 and r.peak_aas = 0.25 and r.p99_aas = 0.24
               and r.backend_seconds = 39.00 and r.pct = 65.00,
               format('top(wait_event_type) IO mismatch: avg=%s peak=%s p99=%s bsec=%s pct=%s',
                      r.avg_aas, r.peak_aas, r.p99_aas, r.backend_seconds, r.pct);
            select * into r from ash.top('wait_event_type', v_from, v_to) where key = 'CPU*';
            assert r.avg_aas = 0.05 and r.backend_seconds = 15.00 and r.pct = 25.00,
               format('top(wait_event_type) CPU* mismatch: avg=%s bsec=%s pct=%s',
                      r.avg_aas, r.backend_seconds, r.pct);
            select * into r from ash.top('wait_event_type', v_from, v_to) where key = 'Lock';
            assert r.backend_seconds = 6.00 and r.pct = 10.00, 'top(wait_event_type) Lock mismatch';

            -- wait_event filtered by type (L2 drill): only IO:DataFileRead, pct 100.
            select * into r from ash.top('wait_event', v_from, v_to, wait_event_type => 'IO');
            assert r.key = 'IO:DataFileRead' and r.backend_seconds = 39.00 and r.pct = 100.00,
               format('top(wait_event|IO) mismatch: key=%s bsec=%s pct=%s', r.key, r.backend_seconds, r.pct);

            -- query_id: q1 27 (45), unattributed NULL 15 (25), q2 12 (20), q3 6 (10).
            select * into r from ash.top('query_id', v_from, v_to) where key = '111111';
            assert r.avg_aas = 0.09 and r.backend_seconds = 27.00 and r.pct = 45.00,
               format('top(query_id) q1 mismatch: avg=%s bsec=%s pct=%s', r.avg_aas, r.backend_seconds, r.pct);
            select count(*) into n from ash.top('query_id', v_from, v_to);
            assert n = 4, 'top(query_id) should return 4 keys, got ' || n;
            -- the unattributed bucket is a NULL key (not the literal 'unknown').
            assert exists (select 1 from ash.top('query_id', v_from, v_to)
                           where key is null and backend_seconds = 15.00),
               'top(query_id) NULL key (CPU has no query) should be 15';
            assert not exists (select 1 from ash.top('query_id', v_from, v_to)
                               where key = 'unknown'),
               'top(query_id) must not emit the literal string unknown';

            -- database: postgres 57 (95), template1 3 (5).
            select * into r from ash.top('database', v_from, v_to) where key = 'postgres';
            assert r.backend_seconds = 57.00 and r.pct = 95.00, 'top(database) postgres mismatch';
            select * into r from ash.top('database', v_from, v_to) where key = 'template1';
            assert r.backend_seconds = 3.00 and r.pct = 5.00, 'top(database) template1 mismatch';

            -- leaf drill (query_id + wait filter): forces raw. IO by query: q1 21, q2 12, q3 6.
            select * into r from ash.top('query_id', v_from, v_to, wait_event => 'DataFileRead')
              where key = '111111';
            assert r.source = 'raw' and r.backend_seconds = 21.00 and r.pct = 53.85,
               format('top(query_id|DataFileRead) q1 mismatch: src=%s bsec=%s pct=%s',
                      r.source, r.backend_seconds, r.pct);

            -- unknown dimension raises.
            begin
              perform * from ash.top('bogus', v_from, v_to);
              raise exception 'top(bogus) should have raised';
            exception when others then
              assert sqlerrm like '%unknown dimension%', 'top(bogus) wrong error: ' || sqlerrm;
            end;
            raise notice 'ash.top PASSED';
          end $$;

          -- --- raw-retention exception (tie drill before raw retention) ----------------
          do $$
          declare v_base int4; v_raised boolean := false;
          begin
            select base_ts into v_base from t2anchor;
            begin
              perform * from ash.top('query_id',
                ash.ts_to_timestamptz(v_base - 3600), ash.ts_to_timestamptz(v_base - 3000),
                wait_event => 'DataFileRead');
              raise exception 'expected raw-retention exception, none raised';
            exception when others then
              -- window is ENTIRELY past raw retention: the error must say the
              -- tie is unrecoverable and point to the untied readers, and must
              -- NOT suggest narrowing (which cannot help here).
              if sqlerrm like '%entirely outside raw retention%'
                 and sqlerrm like '%untied aggregate readers%'
                 and sqlerrm not like '%Narrow the window%' then
                v_raised := true;
              else raise; end if;
            end;
            assert v_raised, 'raw-retention exception message mismatch';
            raise notice 'raw-retention exception PASSED';
          end $$;

          -- --- ash.timeline (per-bucket series + no-data bucket) -----------------------
          do $$
          declare r record; v_from timestamptz; v_to timestamptz; n int;
          begin
            select ash.ts_to_timestamptz(base_ts), ash.ts_to_timestamptz(base_ts + 300)
              into v_from, v_to from t2anchor;

            select count(*) into n from ash.timeline(v_from, v_to);
            assert n = 5, 'timeline should return 5 buckets, got ' || n;
            -- every bucket has one grain (data_points = 1 for raw minute grain).
            select * into r from ash.timeline(v_from, v_to)
              where bucket_start = ash.ts_to_timestamptz((select base_ts + 120 from t2anchor));
            assert r.source = 'raw' and r.data_points = 1 and r.avg_aas = 0.40
               and r.peak_aas = 0.40 and r.p99_aas = 0.40,
               format('timeline spike bucket mismatch: dp=%s avg=%s peak=%s p99=%s',
                      r.data_points, r.avg_aas, r.peak_aas, r.p99_aas);
            select * into r from ash.timeline(v_from, v_to)
              where bucket_start = ash.ts_to_timestamptz((select base_ts from t2anchor));
            assert r.avg_aas = 0.15, 'timeline m0 avg 0.15, got ' || r.avg_aas;

            -- no-data bucket: window over m5 (empty minute) -> data_points 0, null AAS.
            select * into r from ash.timeline(ash.ts_to_timestamptz((select base_ts + 300 from t2anchor)),
                                              ash.ts_to_timestamptz((select base_ts + 360 from t2anchor)));
            assert r.data_points = 0 and r.avg_aas is null and r.peak_aas is null,
               format('timeline no-data bucket mismatch: dp=%s avg=%s', r.data_points, r.avg_aas);
            raise notice 'ash.timeline PASSED';
          end $$;

          -- --- ash.periods (six standard windows) -------------------------------------
          do $$
          declare r record; v_end timestamptz; n int;
          begin
            select ash.ts_to_timestamptz(base_ts + 300) into v_end from t2anchor;
            select count(*) into n from ash.periods(v_end);
            assert n = 6, 'periods should return 6 rows, got ' || n;

            -- 1m period = [m4, m4+60): only m4 (avg 0.15), raw. buckets_with_data
            -- counts covered buckets at the grain named by the bucket column
            -- (always 1 minute for periods).
            select * into r from ash.periods(v_end) where period = '1m';
            assert r.source = 'raw' and r.buckets_with_data = 1 and r.avg_aas = 0.15,
               format('periods 1m mismatch: src=%s bwd=%s avg=%s', r.source, r.buckets_with_data, r.avg_aas);
            assert r.bucket = interval '1 minute',
               'periods bucket column must be 1 minute, got ' || r.bucket;
            -- 5m period = exactly the seeded window.
            select * into r from ash.periods(v_end) where period = '5m';
            assert r.source = 'raw' and r.buckets_with_data = 5 and r.avg_aas = 0.20
               and r.peak_aas = 0.40 and r.p99_aas = 0.39,
               format('periods 5m mismatch: src=%s bwd=%s avg=%s peak=%s p99=%s',
                      r.source, r.buckets_with_data, r.avg_aas, r.peak_aas, r.p99_aas);
            -- 1h period reaches before raw retention -> rollup_1m source.
            select * into r from ash.periods(v_end) where period = '1h';
            assert r.source = 'rollup_1m' and r.buckets_with_data = 5 and r.peak_aas = 0.40,
               format('periods 1h mismatch: src=%s bwd=%s peak=%s', r.source, r.buckets_with_data, r.peak_aas);
            -- every row exposes its grain: 6 rows, all 1-minute buckets.
            select count(*) into n from ash.periods(v_end) where bucket = interval '1 minute';
            assert n = 6, 'periods bucket column on all 6 rows, got ' || n;
            raise notice 'ash.periods PASSED';
          end $$;

          -- --- ash.compare (before/after) ---------------------------------------------
          do $$
          declare r record; v0 timestamptz; v2 timestamptz; v5 timestamptz;
          begin
            select ash.ts_to_timestamptz(base_ts), ash.ts_to_timestamptz(base_ts + 120),
                   ash.ts_to_timestamptz(base_ts + 300)
              into v0, v2, v5 from t2anchor;

            -- overall: w1 [m0,m0+120) avg 18/120=0.15; w2 [m2,m0+300) avg 42/180=0.23.
            select * into r from ash.compare(v0, v2, v2, v5);
            assert r.key = 'overall' and r.avg_aas_1 = 0.15 and r.avg_aas_2 = 0.23
               and r.avg_delta = 0.08,
               format('compare overall mismatch: k=%s a1=%s a2=%s d=%s',
                      r.key, r.avg_aas_1, r.avg_aas_2, r.avg_delta);

            -- dimension: IO delta 0.05; Lock present only in w2 (avg_aas_1 null).
            select * into r from ash.compare(v0, v2, v2, v5, dimension => 'wait_event_type')
              where key = 'IO';
            assert r.avg_aas_1 = 0.10 and r.avg_aas_2 = 0.15 and r.avg_delta = 0.05,
               format('compare IO mismatch: a1=%s a2=%s d=%s', r.avg_aas_1, r.avg_aas_2, r.avg_delta);
            select * into r from ash.compare(v0, v2, v2, v5, dimension => 'wait_event_type')
              where key = 'Lock';
            assert r.avg_aas_1 is null and r.avg_aas_2 = 0.03,
               format('compare Lock (w2-only) mismatch: a1=%s a2=%s', r.avg_aas_1, r.avg_aas_2);
            raise notice 'ash.compare PASSED';
          end $$;

          -- --- ash.samples (raw evidence + filters) -----------------------------------
          do $$
          declare v_from timestamptz; v_to timestamptz; n int; r record;
          begin
            select ash.ts_to_timestamptz(base_ts), ash.ts_to_timestamptz(base_ts + 300)
              into v_from, v_to from t2anchor;

            select count(*) into n from ash.samples(v_from, v_to);
            assert n = 60, 'samples should decode 60 backend-rows, got ' || n;
            select count(*) into n from ash.samples(v_from, v_to, query_id => 111111);
            assert n = 27, 'samples filtered by q1 should be 27, got ' || n;
            select count(*) into n from ash.samples(v_from, v_to, wait_event => 'IO:DataFileRead');
            assert n = 39, 'samples filtered by IO event should be 39, got ' || n;
            -- a known decoded row (spike minute, postgres, IO).
            select * into r from ash.samples(v_from, v_to, wait_event => 'IO:DataFileRead',
                                             query_id => 111111) limit 1;
            assert r.database_name = 'postgres' and r.wait_event = 'IO:DataFileRead'
               and r.query_id = 111111,
               format('samples row mismatch: db=%s ev=%s q=%s', r.database_name, r.wait_event, r.query_id);
            raise notice 'ash.samples PASSED';
          end $$;

          -- --- ash.report (machine JSON load report) ----------------------------------
          do $$
          declare j jsonb; v_from timestamptz; v_to timestamptz;
            expected_keys text[] := array[
              'aas_avg','aas_worst1m','aas_p99','aas_p999',
              'top_events_worst1m','top_events_p99','top_events_p999',
              'top_queryids_worst1m','top_queryids_p99','top_queryids_p999',
              'top_queryids_available','coverage'];
          begin
            select ash.ts_to_timestamptz(base_ts), ash.ts_to_timestamptz(base_ts + 300)
              into v_from, v_to from t2anchor;
            j := ash.report(v_from, v_to);
            assert j is not null, 'report returned null on covered window';

            -- exact top-level key set.
            assert (select array_agg(k order by k) from jsonb_object_keys(j) k)
                   = (select array_agg(k order by k) from unnest(expected_keys) k),
               'report top-level keys mismatch: ' || (select string_agg(k, ',' order by k) from jsonb_object_keys(j) k);

            -- aas_avg per class (cpu .05, io .13, ipc 0, lock .02, lwlock 0; total .20).
            assert (j->'aas_avg'->>'total')::numeric = 0.20, 'report aas_avg.total 0.20';
            assert (j->'aas_avg'->>'cpu')::numeric = 0.05, 'report aas_avg.cpu 0.05';
            assert (j->'aas_avg'->>'io')::numeric = 0.13, 'report aas_avg.io 0.13';
            assert (j->'aas_avg'->>'lock')::numeric = 0.02, 'report aas_avg.lock 0.02';
            assert (j->'aas_avg'->>'ipc')::numeric = 0, 'report aas_avg.ipc 0';
            assert (j->'aas_avg'->>'lwlock')::numeric = 0, 'report aas_avg.lwlock 0';

            -- worst1m / p99 / p999 totals.
            assert (j->'aas_worst1m'->>'total')::numeric = 0.40, 'report aas_worst1m.total 0.40';
            assert (j->'aas_worst1m'->>'io')::numeric = 0.25, 'report aas_worst1m.io 0.25';
            assert (j->'aas_p99'->>'total')::numeric = 0.39, 'report aas_p99.total 0.39';
            assert (j->'aas_p99'->>'io')::numeric = 0.24, 'report aas_p99.io 0.24';
            assert (j->'aas_p999'->>'total')::numeric = 0.40, 'report aas_p999.total 0.40';

            -- top_events_* must NOT carry a cpu key (CPU* has no per-event breakdown)
            -- nor a total key; io key present at the worst minute.
            assert not (j->'top_events_worst1m' ? 'cpu'), 'report top_events must not have cpu key';
            assert not (j->'top_events_worst1m' ? 'total'), 'report top_events must not have total key';
            assert (j->'top_events_worst1m'->'io')->>0 like 'DataFileRead(%',
               'report top_events_worst1m.io should lead with DataFileRead';

            -- top_queryids keys: total + four non-cpu classes; total leads with 111111.
            assert j->'top_queryids_worst1m' ? 'total', 'report top_queryids must have total key';
            assert not (j->'top_queryids_worst1m' ? 'cpu'), 'report top_queryids must not have cpu key';
            assert (j->'top_queryids_worst1m'->'total')->>0 like '111111(%',
               'report top_queryids_worst1m.total should lead with 111111';

            -- attribution/coverage metadata: available flag + coverage object
            -- reconcile the payload against ash.aas() for the same window.
            assert (j->>'top_queryids_available')::boolean is true,
               'report top_queryids_available must be true when attribution present';
            assert j->'coverage'->>'source' = 'rollup_1m', 'report coverage.source rollup_1m';
            assert (j->'coverage'->>'minutes_expected')::int = 5, 'report coverage.minutes_expected 5';
            assert (j->'coverage'->>'minutes_with_data')::int = 5, 'report coverage.minutes_with_data 5';
            assert (j->'coverage'->>'from')::timestamptz = v_from
               and (j->'coverage'->>'to')::timestamptz = v_to,
               'report coverage window must echo the minute-floored request';
            assert j->'coverage' ? 'raw_retention_start', 'report coverage.raw_retention_start present';

            -- vcpus is echoed, cpu-scoring left to the consumer.
            assert (ash.report(v_from, v_to, vcpus => 8)->>'vcpus')::int = 8,
               'report should echo vcpus';

            -- no coverage -> null (consumer skips ingestion).
            assert ash.report(ash.ts_to_timestamptz((select base_ts + 3600 from t2anchor)),
                              ash.ts_to_timestamptz((select base_ts + 7200 from t2anchor))) is null,
               'report over uncovered window should be null';
            raise notice 'ash.report PASSED';
          end $$;

          -- --- ash.report p99/p999 attribution for sparse low-AAS classes (#115) -------
          do $$
          declare
            j jsonb; v_from timestamptz; v_to timestamptz; v_class text;
            v_cpu smallint; v_lw smallint; v_q2 int4; v_m0 int4; v_dp oid;
          begin
            select id into v_cpu from ash.wait_event_map where type='CPU*' and event='CPU*';
            select id into v_lw from ash.wait_event_map where type='LWLock' and event='WALWrite';
            select id into v_q2 from ash.query_map_0 where query_id=222222;
            select base_ts + 600 into v_m0 from t2anchor;
            select oid into v_dp from pg_database where datname='postgres';

            -- Fixture: 5 covered minutes [m0..m4]; LWLock only in m3 (44) and m4 (46).
            -- lwlock per-minute AAS grid = [0, 0, 0, 0.7333, 0.7667]:
            --   p99  = 0.765333... -> displays as 0.77 (ABOVE the true max 0.766667)
            --   p999 = 0.766533... -> displays as 0.77
            -- Filtering the p99/p999 minute sets on the ROUNDED 0.77 matches no minute
            -- at all, wiping out top_events_p99/p999 and top_queryids_p99/p999 for the
            -- class even though aas_p99 reports 0.77; the unrounded thresholds match m4.
            insert into ash.rollup_1m (ts, datid, samples, peak_backends, wait_counts, query_counts) values
              (v_m0,       v_dp, 1, 3,  array[v_cpu, 3],  array[0, 3]::int8[]),
              (v_m0 + 60,  v_dp, 1, 3,  array[v_cpu, 3],  array[0, 3]::int8[]),
              (v_m0 + 120, v_dp, 1, 3,  array[v_cpu, 3],  array[0, 3]::int8[]),
              (v_m0 + 180, v_dp, 1, 44, array[v_lw, 44],  array[222222, 44]::int8[]),
              (v_m0 + 240, v_dp, 1, 46, array[v_lw, 46],  array[222222, 46]::int8[]);
            -- matching raw samples for the extreme minutes (top_queryids attribution).
            insert into ash.sample (sample_ts, datid, active_count, data, slot) values
              (v_m0 + 180, v_dp, 44,
                array[-v_lw, 44]::integer[] || array_fill(v_q2, array[44]), 0),
              (v_m0 + 240, v_dp, 46,
                array[-v_lw, 46]::integer[] || array_fill(v_q2, array[46]), 0);

            v_from := ash.ts_to_timestamptz(v_m0);
            v_to := ash.ts_to_timestamptz(v_m0 + 300);
            j := ash.report(v_from, v_to);
            assert j is not null, 'report(sparse lwlock) returned null';

            -- displayed values round UP above the true per-minute max (0.766667).
            assert (j->'aas_avg'->>'lwlock')::numeric = 0.30, 'sparse lwlock aas_avg 0.30';
            assert (j->'aas_worst1m'->>'lwlock')::numeric = 0.77, 'sparse lwlock aas_worst1m 0.77';
            assert (j->'aas_p99'->>'lwlock')::numeric = 0.77, 'sparse lwlock aas_p99 0.77';
            assert (j->'aas_p999'->>'lwlock')::numeric = 0.77, 'sparse lwlock aas_p999 0.77';

            -- attribution must survive display rounding: minute-set membership is
            -- decided on the UNROUNDED thresholds, so m4 (0.7667) attributes.
            assert j->'top_events_p99'->'lwlock' = '["WALWrite(0.8)"]'::jsonb,
               'sparse lwlock top_events_p99 must attribute WALWrite, got '
               || coalesce((j->'top_events_p99'->'lwlock')::text, '<missing>');
            assert j->'top_events_p999'->'lwlock' = '["WALWrite(0.8)"]'::jsonb,
               'sparse lwlock top_events_p999 must attribute WALWrite, got '
               || coalesce((j->'top_events_p999'->'lwlock')::text, '<missing>');
            assert j->'top_queryids_p99'->'lwlock' = '["222222(0.8)"]'::jsonb,
               'sparse lwlock top_queryids_p99 must attribute 222222, got '
               || coalesce((j->'top_queryids_p99'->'lwlock')::text, '<missing>');
            assert j->'top_queryids_p999'->'lwlock' = '["222222(0.8)"]'::jsonb,
               'sparse lwlock top_queryids_p999 must attribute 222222, got '
               || coalesce((j->'top_queryids_p999'->'lwlock')::text, '<missing>');

            -- invariant across the event-attributed classes: aas_p99 > 0 must never
            -- come with an empty top_events_p99 (cpu has no per-event breakdown).
            for v_class in select unnest(array['io','ipc','lock','lwlock']) loop
              if coalesce((j->'aas_p99'->>v_class)::numeric, 0) > 0 then
                assert jsonb_array_length(coalesce(j->'top_events_p99'->v_class, '[]'::jsonb)) > 0,
                   format('class %s: aas_p99 > 0 but top_events_p99 empty', v_class);
              end if;
            end loop;

            -- leave the shared fixture exactly as this block found it.
            delete from ash.rollup_1m where ts >= v_m0 and ts < v_m0 + 300;
            delete from ash.sample where sample_ts >= v_m0 and sample_ts < v_m0 + 300;
            raise notice 'ash.report sparse-class p99/p999 attribution PASSED';
          end $$;

          -- --- ash.summary + ash.chart (human render helpers, smoke) -------------------
          do $$
          declare v_from timestamptz; v_to timestamptz; n int; v_val text;
          begin
            select ash.ts_to_timestamptz(base_ts), ash.ts_to_timestamptz(base_ts + 300)
              into v_from, v_to from t2anchor;

            -- summary key/value overview mirrors ash.aas + top waits/queries.
            select value into v_val from ash.summary(v_from, v_to) where metric = 'avg_aas';
            assert v_val = '0.20', 'summary avg_aas 0.20, got ' || v_val;
            select value into v_val from ash.summary(v_from, v_to) where metric = 'source';
            assert v_val = 'raw', 'summary source raw, got ' || v_val;
            select value into v_val from ash.summary(v_from, v_to) where metric = 'databases_active';
            assert v_val = '2', 'summary databases_active 2, got ' || v_val;
            select value into v_val from ash.summary(v_from, v_to) where metric = 'top_wait_1';
            assert v_val like 'IO:DataFileRead%', 'summary top_wait_1 should be IO, got ' || v_val;

            -- chart returns a legend row plus one row per bucket (1 + 5).
            select count(*) into n from ash.chart(v_from, v_to);
            assert n = 6, 'chart should return legend + 5 buckets = 6 rows, got ' || n;
            assert exists (select 1 from ash.chart(v_from, v_to)
                           where bucket_start is null and chart is not null),
               'chart should emit a legend row';
            raise notice 'ash.summary + ash.chart PASSED';
          end $$;
          EOF

      - name: "Test 2.0: report totals and formatting edges"
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          do $$
          declare
            v_ts int4 := ash.ts_from_timestamptz(
              date_trunc('minute', now()) - interval '10 minutes');
            v_cpu smallint;
            v_io smallint;
            v_ipc smallint;
            v_lock smallint;
            v_lwlock smallint;
            v_client smallint;
            v_cpu_map int4;
            v_client_map int4;
            v_large_map int4;
            j jsonb;
            v_text text[];
          begin
            truncate ash.sample_0, ash.sample_1, ash.sample_2;
            truncate ash.rollup_1m, ash.rollup_1h;
            update ash.config
            set current_slot = 0, sample_interval = interval '1 second',
                last_rollup_1m_ts = null, last_rollup_1h_ts = null
            where singleton;

            select ash._register_wait('active', 'CPU*', 'CPU*') into v_cpu;
            select ash._register_wait('active', 'IO', 'DataFileRead') into v_io;
            select ash._register_wait('active', 'IPC', 'ProcArrayGroupUpdate')
            into v_ipc;
            select ash._register_wait('active', 'Lock', 'transactionid')
            into v_lock;
            select ash._register_wait('active', 'LWLock', 'WALWrite')
            into v_lwlock;
            select ash._register_wait('active', 'Client', 'ClientRead')
            into v_client;

            insert into ash.query_map_0 (query_id)
            values (900000000000001), (900000000000002), (900000000000003)
            on conflict (query_id) do nothing;
            select id into v_cpu_map from ash.query_map_0
            where query_id = 900000000000001;
            select id into v_client_map from ash.query_map_0
            where query_id = 900000000000002;
            select id into v_large_map from ash.query_map_0
            where query_id = 900000000000003;

            -- The report total excludes Client, so total query attribution
            -- must not let a Client-dominant query explain that total.
            insert into ash.rollup_1m (
              ts, datid, samples, peak_backends, wait_counts, query_counts
            ) values (
              v_ts, 0::oid, 1, 21,
              array[v_cpu, 1, v_client, 20]::int4[], '{}'::int8[]
            );
            insert into ash.sample (
              sample_ts, datid, active_count, data, slot
            ) values (
              v_ts, 0::oid, 21,
              array[-v_cpu, 1, v_cpu_map, -v_client, 20]::int4[]
                || array_fill(v_client_map, array[20]),
              0
            );
            j := ash.report(
              ash.ts_to_timestamptz(v_ts),
              ash.ts_to_timestamptz(v_ts + 60)
            );
            assert (j->'aas_worst1m'->>'total')::numeric = 0.02,
              'report total fixture must include CPU only';
            assert j->'top_queryids_worst1m'->'total'
                     = '["900000000000001(0.0)"]'::jsonb,
              'report total query attribution included an excluded wait class: '
              || (j->'top_queryids_worst1m'->'total')::text;

            -- Total average comes from the summed series, not the sum of five
            -- independently rounded display fields: 5 / 60 rounds to 0.08.
            truncate ash.sample_0, ash.sample_1, ash.sample_2;
            truncate ash.rollup_1m;
            insert into ash.rollup_1m (
              ts, datid, samples, peak_backends, wait_counts, query_counts
            ) values (
              v_ts, 0::oid, 1, 5,
              array[
                v_cpu, 1, v_io, 1, v_ipc, 1, v_lock, 1, v_lwlock, 1
              ]::int4[],
              '{}'::int8[]
            );
            j := ash.report(
              ash.ts_to_timestamptz(v_ts),
              ash.ts_to_timestamptz(v_ts + 60)
            );
            assert (j->'aas_avg'->>'total')::numeric = 0.08,
              'report aas_avg.total must be 0.08, got '
              || (j->'aas_avg'->>'total');
            assert (j->'aas_avg'->>'total')::numeric
                     <= (j->'aas_worst1m'->>'total')::numeric,
              'report average total cannot exceed its worst minute';

            -- Four-digit AAS must remain numeric text, not to_char hash
            -- overflow. 30,000 appearances * 2 seconds / 60 = 1,000.0.
            truncate ash.rollup_1m;
            insert into ash.rollup_1m (
              ts, datid, samples, peak_backends, wait_counts, query_counts
            ) values (
              v_ts, 0::oid, 1, 30000,
              array[v_io, 30000]::int4[], '{}'::int8[]
            );
            insert into ash.sample (
              sample_ts, datid, active_count, data, slot
            ) values (
              v_ts, 0::oid, 30000,
              array[-v_io, 30000]::int4[]
                || array_fill(v_large_map, array[30000]),
              0
            );
            v_text := ash._hr_top_events('IO', array[v_ts], 1, 2);
            assert v_text = array['DataFileRead(1000.0)'],
              'large event AAS formatting mismatch: ' || v_text::text;
            v_text := ash._hr_top_queryids('IO', array[v_ts], 1, 2);
            assert v_text = array['900000000000003(1000.0)'],
              'large query AAS formatting mismatch: ' || v_text::text;

            truncate ash.sample_0, ash.sample_1, ash.sample_2;
            truncate ash.rollup_1m, ash.rollup_1h;
            raise notice 'ash.report totals and formatting edges PASSED';
          end $$;
          EOF

      - name: "Test 2.0: pg_stat_statements fan-out and reader edges"
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          -- Ported pgss-fanout regression + zero-bucket/limit edges (2.0).
          drop role if exists pgash_pgss_fanout_a;
          drop role if exists pgash_pgss_fanout_b;
          create role pgash_pgss_fanout_a;
          create role pgash_pgss_fanout_b;
          grant pgash_pgss_fanout_a, pgash_pgss_fanout_b to current_user;
          select pg_stat_statements_reset();
          set role pgash_pgss_fanout_a;
          select 424242::int as pgash_fanout_probe;
          reset role;
          set role pgash_pgss_fanout_b;
          select 424242::int as pgash_fanout_probe;
          reset role;

          do $$
          declare
            v_query_id bigint; v_pgss_rows int; v_wait_id smallint; v_map_id int4;
            v_sample_ts int4; v_datid oid := (select oid from pg_database where datname = current_database());
            v_from timestamptz; v_count int;
          begin
            truncate ash.sample_0, ash.sample_1, ash.sample_2;
            update ash.config set current_slot = 0 where singleton;
            select queryid, count(*) into v_query_id, v_pgss_rows
            from pg_stat_statements where query like '%pgash_fanout_probe%'
            group by queryid having count(*) >= 2 limit 1;
            assert v_query_id is not null, 'pgss did not record duplicate rows for the fanout probe';

            insert into ash.wait_event_map (state, type, event) values ('active', 'CPU', 'CPU')
              on conflict (state, type, event) do update set state = excluded.state returning id into v_wait_id;
            insert into ash.query_map_0 (query_id) values (v_query_id)
              on conflict (query_id) do update set query_id = excluded.query_id returning id into v_map_id;
            -- Minute-aligned, 3 minutes back: this becomes the raw-retention start, so a
            -- window starting exactly here reads raw (the wait<->query tie needs raw).
            v_sample_ts := (ash.ts_from_timestamptz(date_trunc('minute', now() - interval '3 minutes')) / 60) * 60;
            v_from := ash.ts_to_timestamptz(v_sample_ts);
            insert into ash.sample (sample_ts, datid, active_count, data, slot)
              values (v_sample_ts, v_datid, 1, array[-v_wait_id::int, 1, v_map_id]::int[], 0);

            -- one ASH sample -> exactly one samples() row, regardless of pgss fan-out.
            select count(*) into v_count from ash.samples(v_from, now(), 1000)
              where query_id = v_query_id;
            assert v_count = 1, format('samples() one row per sample; got %s with %s pgss rows', v_count, v_pgss_rows);

            -- the leaf drill (query_id dimension + wait filter) likewise yields one row.
            select count(*) into v_count
              from ash.top('query_id', v_from, now(), wait_event => 'CPU', n => 1000)
              where key = v_query_id::text;
            assert v_count = 1, format('top(query_id|CPU) one row per query_id; got %s with %s pgss rows', v_count, v_pgss_rows);
            raise notice 'pgss fanout regression PASSED';
          end $$;

          -- zero / sub-minute bucket rejection across the readers that take a bucket.
          do $$
          declare v_from timestamptz := now() - interval '1 hour'; v_to timestamptz := now();
          begin
            begin perform * from ash.timeline(v_from, v_to, '0 seconds');
              raise exception 'timeline accepted zero bucket';
            exception when others then assert sqlerrm ilike '%bucket%', 'timeline zero-bucket: ' || sqlerrm; end;
            begin perform * from ash.aas(v_from, v_to, bucket => '0 seconds');
              raise exception 'aas accepted zero bucket';
            exception when others then assert sqlerrm ilike '%bucket%', 'aas zero-bucket: ' || sqlerrm; end;
            begin perform * from ash.top('wait_event', v_from, v_to, bucket => '0 seconds');
              raise exception 'top accepted zero bucket';
            exception when others then assert sqlerrm ilike '%bucket%', 'top zero-bucket: ' || sqlerrm; end;
            begin perform * from ash.chart(v_from, v_to, '0 seconds');
              raise exception 'chart accepted zero bucket';
            exception when others then assert sqlerrm ilike '%bucket%', 'chart zero-bucket: ' || sqlerrm; end;
            raise notice 'zero-bucket rejection PASSED';
          end $$;

          -- n caps the number of returned rows (2.0 top has no synthetic Other row).
          do $$
          declare n int;
          begin
            select count(*) into n from ash.top('query_id', now() - interval '1 hour', now(), n => 1);
            assert n <= 1, 'top n=1 should return at most 1 row, got ' || n;
            select count(*) into n from ash.top('wait_event_type', now() - interval '1 hour', now(), n => 0);
            assert n = 0, 'top n=0 should return 0 rows, got ' || n;
            raise notice 'top limit PASSED';
          end $$;
          EOF

      - name: "Test 2.0: pgss shadow mitigation (non-public schema, security #76)"
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          -- Regression for security review #76 AND the 2.0 rename regression that
          -- silently un-covered it (the reader list was hand-maintained with v1.x
          -- names). When pgss lives outside `public`, ash._apply_pgss_search_path()
          -- must rewrite EVERY pgss-probing reader so the real pgss schema is listed
          -- BEFORE `public` — otherwise a planted `public.pg_stat_statements` view
          -- shadows the real one and feeds attacker-controlled query_text (and, via
          -- SECURITY INVOKER, code execution) into monitoring calls.
          --
          -- Skip cleanly when pgss is unavailable for this PG major. The probe for
          -- the behavioral half must run at top level (pgss does not capture a
          -- statement executed inside a DO block), hence the \gset/\if scaffolding.
          select exists (select 1 from pg_extension where extname = 'pg_stat_statements') as has_pgss \gset
          \if :has_pgss
          -- Relocate the real pgss into a non-public schema (the RDS/Supabase/
          -- AlloyDB "extensions" layout this helper exists for).
          create schema if not exists ash_pgss_ext;
          alter extension pg_stat_statements set schema ash_pgss_ext;
          select ash._apply_pgss_search_path();

          -- (1) Catalog form: every pgss-probing reader lists the pgss schema
          -- before public, and the catalog-derived set has not drifted.
          do $$
          declare
            r record;
            v_bad text := '';
            v_ext_pos int;
            v_pub_pos int;
            v_readers text[] := array['_pgss_query_text','top','compare','samples','_samples','summary'];
          begin
            assert ash._pgss_schema() = 'ash_pgss_ext',
              'pgss schema should be ash_pgss_ext after relocation';
            for r in
              select p.proname, unnest(p.proconfig) as cfg
              from pg_proc p join pg_namespace n on n.oid = p.pronamespace
              where n.nspname = 'ash' and p.proname = any(v_readers)
            loop
              if r.cfg like 'search_path=%' then
                v_ext_pos := position('ash_pgss_ext' in r.cfg);
                v_pub_pos := position('public' in r.cfg);
                if v_ext_pos = 0 or v_ext_pos > v_pub_pos then
                  v_bad := v_bad || r.proname || ' ';
                end if;
              end if;
            end loop;
            assert v_bad = '',
              'pgss shadow mitigation FAILED — these readers do not list the pgss '
              || 'schema before public: ' || v_bad;
            select string_agg(proname, ' ' order by proname) into v_bad
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'ash' and p.prokind = 'f'
              and exists (
                select 1 from unnest(coalesce(p.proconfig, array[]::text[])) c
                where c like 'search_path=%'
                  and (',' || replace(split_part(c, '=', 2), ' ', '') || ',') like '%,public,%'
              );
            assert v_bad = '_pgss_query_text _samples compare samples summary top',
              'unexpected pgss-reader set (drift?): ' || coalesce(v_bad, '<none>');
            raise notice 'pgss shadow mitigation (catalog) PASSED';
          end $$;

          -- (2) Behavioral form: plant the actual attack — a public.pg_stat_statements
          -- with the SAME queryid but attacker text — and prove the reader still
          -- resolves the REAL text from the relocated schema. Probe at top level so
          -- pgss records it.
          select ash_pgss_ext.pg_stat_statements_reset();
          select 987654321 as ash_shadow_probe_marker;
          do $$
          declare v_qid bigint; v_txt text;
          begin
            select queryid into v_qid from ash_pgss_ext.pg_stat_statements
              where query like '%ash_shadow_probe_marker%'
                and query not like '%pg_stat_statements%'
              limit 1;
            assert v_qid is not null, 'behavioral probe was not captured by pgss';
            execute format(
              'create view public.pg_stat_statements as select %s::bigint as queryid, %L::text as query',
              v_qid, 'ATTACKER-CONTROLLED-TEXT');
            v_txt := ash._pgss_query_text(v_qid);
            assert v_txt is not null and v_txt not like 'ATTACKER%',
              format('SHADOW WON: reader returned %L for queryid %s', v_txt, v_qid);
            drop view public.pg_stat_statements;
            raise notice 'pgss shadow mitigation (behavioral) PASSED — real text won: %',
              left(v_txt, 45);
          end $$;

          -- Restore pgss to public so downstream steps see the default layout.
          alter extension pg_stat_statements set schema public;
          select ash._apply_pgss_search_path();
          drop schema if exists ash_pgss_ext;
          \else
          \echo 'SKIP: pg_stat_statements not installed on this PG major'
          \endif
          EOF

      - name: "Test 2.0: pgss spoof must not leak via a no-USAGE reader (security #115)"
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          -- Regression for #115: name resolution SKIPS search_path schemas the
          -- caller lacks USAGE on, so the #76 ordering (real pgss schema listed
          -- before public) is inert for a reader without USAGE on that schema —
          -- an UNQUALIFIED pg_stat_statements reference falls through to a
          -- planted public.pg_stat_statements and leaks attacker-controlled
          -- query_text. The fix schema-qualifies every pgss data access with
          -- the catalog-derived ash._pgss_schema(): such a reader gets real
          -- text or NULL, NEVER the planted text.
          select exists (select 1 from pg_extension where extname = 'pg_stat_statements') as has_pgss \gset
          \if :has_pgss
          -- Arrange: pgss relocated out of public; a world-readable fake in
          -- public carrying a queryid the victim's dashboards will look up; a
          -- monitoring role with the reader bundle + pg_read_all_stats but NO
          -- USAGE on the relocated pgss schema.
          create schema ash_spoof_s;
          alter extension pg_stat_statements set schema ash_spoof_s;
          select ash._apply_pgss_search_path();

          create table public.pg_stat_statements (queryid bigint, query text);
          grant select on public.pg_stat_statements to public;

          drop role if exists ash_spoof_reader;
          create role ash_spoof_reader;
          select ash.grant_reader('ash_spoof_reader');
          grant pg_read_all_stats to ash_spoof_reader;

          -- Deterministic sample fixture (same shape as the pgss fan-out test):
          -- one synthetic sample with a known query_id, plus the spoof row
          -- claiming that very queryid.
          do $$
          declare
            v_wait_id smallint; v_map_id int4; v_sample_ts int4;
            v_datid oid := (select oid from pg_database where datname = current_database());
          begin
            truncate ash.sample_0, ash.sample_1, ash.sample_2;
            update ash.config set current_slot = 0 where singleton;
            insert into ash.wait_event_map (state, type, event) values ('active', 'CPU', 'CPU')
              on conflict (state, type, event) do update set state = excluded.state returning id into v_wait_id;
            insert into ash.query_map_0 (query_id) values (115115115)
              on conflict (query_id) do update set query_id = excluded.query_id returning id into v_map_id;
            v_sample_ts := (ash.ts_from_timestamptz(date_trunc('minute', now() - interval '3 minutes')) / 60) * 60;
            insert into ash.sample (sample_ts, datid, active_count, data, slot)
              values (v_sample_ts, v_datid, 1, array[-v_wait_id::int, 1, v_map_id]::int[], 0);
            insert into public.pg_stat_statements values
              (115115115, 'SPOOFED-select pg_read_file(''secrets'')');
          end $$;

          set role ash_spoof_reader;
          do $$
          declare
            v_from timestamptz := ash._raw_retention_start();
            n int; v_spoofed int; v_txt text;
          begin
            -- The attack preconditions really hold for THIS role: the spoof
            -- is readable, the real pgss schema is not.
            assert not has_schema_privilege('ash_spoof_s', 'usage'),
              'reader must lack USAGE on the relocated pgss schema';
            select count(*) into n from public.pg_stat_statements where query like 'SPOOFED%';
            assert n = 1, 'spoof row must be planted and readable by the reader';

            -- top('query_id'): the synthetic row comes back; its text is real
            -- or NULL, never the planted text.
            select count(*), count(*) filter (where query_text like 'SPOOFED%')
              into n, v_spoofed
              from ash.top('query_id', v_from, now(), n => 10000)
              where key = '115115115';
            assert n = 1, format('top must return the synthetic query row, got %s', n);
            assert v_spoofed = 0, 'SPOOF LEAKED through ash.top query_text';

            select count(*), count(*) filter (where query_text like 'SPOOFED%')
              into n, v_spoofed
              from ash.samples(v_from, now(), 10000)
              where query_id = 115115115;
            assert n = 1, format('samples must return the synthetic row, got %s', n);
            assert v_spoofed = 0, 'SPOOF LEAKED through ash.samples query_text';

            v_txt := ash._pgss_query_text(115115115);
            assert v_txt is null or v_txt not like 'SPOOFED%',
              format('SPOOF LEAKED through ash._pgss_query_text: %L', v_txt);
            raise notice 'pgss no-USAGE spoof regression (#115) PASSED';
          end $$;
          reset role;

          -- Cleanup: restore the default layout for downstream steps.
          drop table public.pg_stat_statements;
          select ash.revoke_reader('ash_spoof_reader');
          drop role ash_spoof_reader;
          alter extension pg_stat_statements set schema public;
          select ash._apply_pgss_search_path();
          drop schema ash_spoof_s;
          \else
          \echo 'SKIP: pg_stat_statements not installed on this PG major'
          \endif
          EOF

      - name: Test internal helper functions
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          do $$
          declare
            v_slot smallint;
            v_slots smallint[];
            v_ts int4;
            v_wait_id smallint;
            v_cron_avail boolean;
          begin
            -- current_slot: returns current partition slot
            select ash.current_slot() into v_slot;
            assert v_slot >= 0 and v_slot < (select num_partitions from ash.config where singleton),
              'current_slot out of range: ' || v_slot;

            -- _active_slots: returns current + previous slot
            select ash._active_slots() into v_slots;
            assert array_length(v_slots, 1) = 2,
              '_active_slots should return 2 elements, got: ' || array_length(v_slots, 1);
            assert v_slots[1] = v_slot,
              '_active_slots[1] should be current slot';
            assert v_slots[2] = ((v_slot - 1 + (select num_partitions from ash.config where singleton)) % (select num_partitions from ash.config where singleton))::smallint,
              '_active_slots[2] should be previous slot';

            -- ts_from_timestamptz: converts timestamptz to int4 offset from epoch
            select ash.ts_from_timestamptz(ash.epoch()) into v_ts;
            assert v_ts = 0, 'ts_from_timestamptz(epoch) should be 0, got: ' || v_ts;

            select ash.ts_from_timestamptz(ash.epoch() + interval '1 hour') into v_ts;
            assert v_ts = 3600, 'ts_from_timestamptz(epoch+1h) should be 3600, got: ' || v_ts;

            -- ts_from_timestamptz: future timestamps should be positive
            select ash.ts_from_timestamptz(now()) into v_ts;
            assert v_ts > 0, 'ts_from_timestamptz(now) should be positive';

            -- _register_wait: register a new wait event
            select ash._register_wait('active', 'Test', 'TestEvent') into v_wait_id;
            assert v_wait_id is not null, '_register_wait returned null';

            -- _register_wait: same call should return same id (idempotent)
            declare
              v_wait_id2 smallint;
            begin
              select ash._register_wait('active', 'Test', 'TestEvent') into v_wait_id2;
              assert v_wait_id2 = v_wait_id,
                '_register_wait not idempotent: ' || v_wait_id || ' vs ' || v_wait_id2;
            end;

            -- _register_wait: different event should get different id
            declare
              v_wait_id3 smallint;
            begin
              select ash._register_wait('active', 'Test', 'OtherEvent') into v_wait_id3;
              assert v_wait_id3 <> v_wait_id,
                '_register_wait should return different id for different event';
            end;

            -- _pg_cron_available: should return boolean without error
            select ash._pg_cron_available() into v_cron_avail;
            assert v_cron_avail is not null, '_pg_cron_available returned null';

            -- epoch: should be 2026-01-01 00:00:00 UTC
            assert ash.epoch() = '2026-01-01 00:00:00+00'::timestamptz,
              'epoch should be 2026-01-01, got: ' || ash.epoch();

            raise notice 'Internal helper tests PASSED';
          end;
          $$;
          EOF

