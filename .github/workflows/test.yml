      - name: "Release upgrade path: actual v1.4 tag to v1.5"
        if: matrix.postgres == 17 && matrix.cron == 'on'
        env:
          PGPASSWORD: postgres
        run: |
          git show v1.4:sql/ash-install.sql > /tmp/ash-v1.4-install.sql
          git show v1.5:sql/ash-install.sql > /tmp/ash-v1.5-install.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          \i /tmp/ash-v1.4-install.sql

          do $$
          declare
            v_wait_id smallint;
            v_slot smallint;
            v_ts int4 := ash.ts_from_timestamptz(now());
          begin
            select ash._register_wait('active', 'DirectUpgrade', 'ValidRaw') into v_wait_id;
            select ash.current_slot() into v_slot;

            -- v1.4 permits this malformed payload. v1.5 must not fail the
            -- whole release upgrade when a legacy database already contains it.
            insert into ash.sample(sample_ts, datid, active_count, data, slot)
            values (v_ts - 10, 0::oid, 1000, array[-v_wait_id, 1000, 0]::int4[], v_slot);

            -- Valid raw data seeded before the upgrade must still decode after
            -- the direct v1.4 -> v1.5 wrapper.
            insert into ash.sample(sample_ts, datid, active_count, data, slot)
            values (v_ts - 5, 0::oid, 1, array[-v_wait_id, 1, 0]::int4[], v_slot);
          end $$;

          \i /tmp/ash-v1.5-install.sql

          do $$
          declare
            v_count int;
            v_wait_id smallint;
            v_slot smallint;
            v_retained_slot smallint;
            v_ts int4 := ash.ts_from_timestamptz(now());
          begin
            assert (select version from ash.config where singleton) = '1.5',
              'direct v1.4 -> v1.5 upgrade did not stamp version 1.5';

            select count(*) into v_count
            from ash.sample
            where not ash._sample_data_is_valid(data);
            assert v_count = 0,
              format('direct v1.4 -> v1.5 upgrade left % malformed sample rows', v_count);

            assert exists (
              select 1 from ash.top_waits('1 hour', 100)
              where wait_event = 'DirectUpgrade:ValidRaw'
            ), 'direct v1.4 -> v1.5 upgrade lost valid pre-upgrade raw sample';

            perform ash.rebuild_partitions(5, 'yes');
            select ash.current_slot() into v_slot;
            v_retained_slot := ((v_slot - 3 + 5) % 5)::smallint;
            select ash._register_wait('active', 'DirectUpgrade', 'RetainedSlot') into v_wait_id;

            execute format(
              'insert into ash.sample_%s(sample_ts, datid, active_count, data, slot) values (%s, 0::oid, 1, %L::int4[], %s)',
              v_retained_slot,
              v_ts - 60,
              array[-v_wait_id, 1, 0]::int4[],
              v_retained_slot
            );

            assert exists (
              select 1 from ash.top_waits('2 days', 100)
              where wait_event = 'DirectUpgrade:RetainedSlot'
            ), 'direct v1.4 -> v1.5 upgrade did not honor rebuilt retained raw slots';

            raise notice 'direct v1.4 -> v1.5 release upgrade regression PASSED';
          end $$;

          select ash.uninstall('yes');
          EOF

      - name: "Upgrade path: discovered full chain"
        env:
          PGPASSWORD: postgres
        run: |
          python3 devel/scripts/ash_sql_chain.py full-upgrade-chain > /tmp/ash_full_upgrade_chain.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          \i /tmp/ash_full_upgrade_chain.sql

          do $$
          begin
            assert exists (
              select from information_schema.columns
              where table_schema = 'ash' and table_name = 'config' and column_name = 'missed_samples'
            ), 'missed_samples column missing after full upgrade';
            assert (select missed_samples from ash.config where singleton) = 0,
              'missed_samples should be 0 after upgrade';
            perform * from ash.chart(now() - interval '1 hour', now());
            perform ash.report(now() - interval '1 hour', now());
            raise notice 'discovered full upgrade chain PASSED';
          end;
          $$;

          begin;

          truncate ash.wait_event_map restart identity cascade;
          update ash.config set register_wait_cap_hits = 0 where singleton;

          insert into ash.wait_event_map (state, type, event)
          select
            'active',
            'upgrade_synthetic_type_' || i,
            'upgrade_synthetic_event_' || i
          from generate_series(1, 32000) as gs(i);

          do $$
          declare
            v_id smallint;
            v_rows bigint;
            v_hits bigint;
          begin
            select ash._register_wait(
              'active',
              'upgrade_synthetic_type_over_cap',
              'upgrade_synthetic_event_over_cap'
            ) into v_id;

            assert v_id is null,
              'latest upgrade _register_wait should return NULL once wait_event_map has 32000 rows';

            select count(*) into v_rows from ash.wait_event_map;
            assert v_rows = 32000,
              'latest upgrade wait_event_map cap should prevent row 32001, got ' || v_rows;

            select register_wait_cap_hits into v_hits from ash.config where singleton;
            assert v_hits = 1,
              'latest upgrade register_wait_cap_hits should increment at cap, got ' || v_hits;
          end;
          $$;

          rollback;

          -- Uninstall after upgrade test
          select ash.uninstall('yes');
          EOF

      - name: "Issue #49: sample_data_check tightened by discovered upgrade chain"
        env:
          PGPASSWORD: postgres
        run: |
          # Regression for issue #49 and #89: the oldest released installer
          # shipped `array_length(data, 1) >= 2`; later releases require full
          # packed-array shape validation. The current development upgrade
          # chain detects and rewrites old checks; assert that the discovered
          # full chain ends with the validator helper on both the partitioned
          # parent and every partition.
          python3 devel/scripts/ash_sql_chain.py oldest-install-path | sed 's#^#\\i #' > /tmp/ash_oldest_install.sql
          python3 devel/scripts/ash_sql_chain.py upgrade-chain-from-oldest > /tmp/ash_upgrade_from_oldest.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          \i /tmp/ash_oldest_install.sql

          -- Sanity-check the precondition: the oldest released installer ships the looser form.
          do $$
          declare
            v_def text;
          begin
            select pg_get_constraintdef(c.oid) into v_def
            from pg_constraint c
            where c.conrelid = 'ash.sample'::regclass
              and c.conname  = 'sample_data_check';
            assert v_def ~ 'array_length\(data, 1\) >= 2',
              format('oldest released installer should ship `>= 2` form; got: %s', v_def);
          end $$;

          \i /tmp/ash_upgrade_from_oldest.sql

          -- After full dev chain: parent + every partition must carry the
          -- packed-array validator, and none may carry legacy array_length
          -- checks.
          do $$
          declare
            v_bad int;
            v_parent_def text;
          begin
            select pg_get_constraintdef(c.oid) into v_parent_def
            from pg_constraint c
            where c.conrelid = 'ash.sample'::regclass
              and c.conname  = 'sample_data_check';
            assert v_parent_def ~ '_sample_data_is_valid',
              format('parent constraint not upgraded to validator; got: %s', v_parent_def);

            select count(*) into v_bad
            from pg_constraint c
            join pg_class    t on t.oid = c.conrelid
            join pg_namespace n on n.oid = t.relnamespace
            where n.nspname = 'ash'
              and t.relname ~ '^sample(_[0-9]+)?$'
              and c.contype = 'c'
              and pg_get_constraintdef(c.oid) ~ 'array_length\(data, 1\)';
            assert v_bad = 0,
              format('%s ash.sample* check(s) still carry a legacy array_length form', v_bad);

            select count(*) into v_bad
            from pg_inherits i
            join pg_class    p on p.oid = i.inhrelid
            join pg_namespace n on n.oid = p.relnamespace
            left join pg_constraint c
              on c.conrelid = p.oid
             and c.contype  = 'c'
             and pg_get_constraintdef(c.oid) ~ '_sample_data_is_valid'
            where i.inhparent = 'ash.sample'::regclass
              and n.nspname = 'ash'
              and c.oid is null;
            assert v_bad = 0,
              format('%s partition(s) of ash.sample missing validator check', v_bad);

            raise notice 'issue #49/#89 regression PASSED: sample_data_check uses validator everywhere';
          end $$;

          select ash.uninstall('yes');
          EOF

      - name: "Upgrade path via documented wrappers + data preservation (issue #37 H-CI-1, H-CI-2)"
        env:
          PGPASSWORD: postgres
        run: |
          # This step exercises the discovered wrapper chain AND asserts a
          # seeded row is preserved end-to-end (and that new columns get
          # sensible defaults).
          python3 devel/scripts/ash_sql_chain.py oldest-install-path | sed 's#^#\\i #' > /tmp/ash_oldest_install.sql
          python3 devel/scripts/ash_sql_chain.py upgrade-chain-from-oldest > /tmp/ash_upgrade_from_oldest.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          -- Install oldest released schema
          \i /tmp/ash_oldest_install.sql

          -- Seed fixtures at the oldest released schema:
          --   (a) a non-default config value that all upgrades must preserve
          --   (b) a wait_event_map row + query_map_0 row + a sample referencing them
          --       using a sentinel query_id we can look up later
          update ash.config
            set include_bg_workers = true,
                sample_interval    = '7 seconds',
                rotation_period    = '3 days'
            where singleton;

          insert into ash.wait_event_map (state, type, event)
            values ('active', 'CPU*', 'CPU*')
            on conflict do nothing;

          insert into ash.query_map_0 (query_id) values (424242)
            on conflict do nothing;

          do $$
          declare
            v_wait_id smallint;
            v_qid_id  int4;
            v_slot    smallint;
            v_ts      int4;
          begin
            select id into v_wait_id from ash.wait_event_map
              where state='active' and type='CPU*' and event='CPU*';
            select id into v_qid_id from ash.query_map_0 where query_id = 424242;
            v_slot := ash.current_slot();
            v_ts := extract(epoch from now() - ash.epoch())::int4;
            insert into ash.sample (sample_ts, datid, active_count, data, slot)
              values (v_ts, 1, 1, array[-v_wait_id, 1, v_qid_id]::integer[], v_slot);
            assert exists (
              select from ash.sample where datid = 1 and active_count = 1
            ), 'oldest-release fixture sample row missing';
            raise notice 'oldest released schema installed and fixtures seeded';
          end;
          $$;

          -- Upgrade chain via discovered documented wrappers (H-CI-1).
          \i /tmp/ash_upgrade_from_oldest.sql

          -- Assertions after reaching current development state.
          do $$
          declare
            v_cfg record;
            v_sample_rows int;
            v_qid_id int4;
          begin
            -- (H-CI-2) Pre-existing config values must survive
            select * into v_cfg from ash.config where singleton;
            assert v_cfg.include_bg_workers = true,
              'include_bg_workers not preserved across upgrades';
            assert v_cfg.sample_interval = interval '7 seconds',
              'sample_interval not preserved, got: ' || v_cfg.sample_interval::text;
            assert v_cfg.rotation_period = interval '3 days',
              'rotation_period not preserved, got: ' || v_cfg.rotation_period::text;

            -- Columns added in later versions must be populated with sensible defaults
            assert v_cfg.debug_logging = false,
              'debug_logging should default to false after upgrade, got: ' || v_cfg.debug_logging::text;
            assert v_cfg.missed_samples = 0,
              'missed_samples should default to 0 after upgrade, got: ' || v_cfg.missed_samples::text;

            -- (H-CI-2) Seeded wait_event_map and query_map rows survive
            assert exists (
              select from ash.wait_event_map
              where state='active' and type='CPU*' and event='CPU*'
            ), 'seeded wait_event_map row lost across upgrade';

            select id into v_qid_id from ash.query_map_0 where query_id = 424242;
            assert v_qid_id is not null,
              'seeded query_map_0 row (query_id=424242) lost across upgrade';

            -- (H-CI-2) The seeded sample row survives
            select count(*) into v_sample_rows
              from ash.sample where datid = 1 and active_count = 1;
            assert v_sample_rows >= 1,
              'seeded ash.sample row lost across upgrade (count=' || v_sample_rows || ')';

            -- The sample must decode into our sentinel query_id
            assert exists (
              select 1
              from ash.sample s,
                   lateral ash.decode_sample(s.data, s.slot) d
              where s.datid = 1 and s.active_count = 1
                and d.query_id = 424242
            ), 'decoded sample no longer references sentinel query_id 424242';

            raise notice 'Wrapper-chain upgrade + data preservation PASSED';
          end;
          $$;

          select ash.uninstall('yes');
          EOF

      - name: "Upgrade path: discovered direct chain from second released installer"
