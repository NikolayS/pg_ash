      - name: "Test edge cases and corner cases"
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          -- Edge and corner cases (2.0). Non-reader behaviors (decode_sample, int4 epoch
          -- clamp, rotation, partition isolation, multi-database) plus the 2.0 readers'
          -- handling of future / out-of-retention windows.
          do $$
          declare
            v_count int;
            v_from timestamptz;
          begin
            -- === Future windows: no measured load ===
            -- top / samples yield zero rows; timeline emits no-data buckets (data_points=0).
            select count(*) into v_count
              from ash.top('wait_event', now() + interval '1 hour', now() + interval '2 hours');
            assert v_count = 0, 'future top(wait_event) should return 0 rows, got ' || v_count;
            select count(*) into v_count
              from ash.top('query_id', now() + interval '1 hour', now() + interval '2 hours');
            assert v_count = 0, 'future top(query_id) should return 0 rows, got ' || v_count;
            select count(*) into v_count
              from ash.samples(now() + interval '1 hour', now() + interval '2 hours');
            assert v_count = 0, 'future samples should return 0 rows, got ' || v_count;
            assert (select bool_and(data_points = 0 and avg_aas is null)
                    from ash.timeline(now() + interval '1 hour', now() + interval '2 hours')),
              'future timeline buckets should all be no-data';

            -- === int4 epoch-offset clamp (#63): helper stays in 2.0 ===
            assert ash.ts_from_timestamptz('1000-01-01'::timestamptz) = 0,
              'ts_from_timestamptz(1000-01-01) should clamp to 0';
            assert ash.ts_from_timestamptz('3000-01-01'::timestamptz) = 2147483647,
              'ts_from_timestamptz(3000-01-01) should clamp to INT4_MAX';
            -- ash.samples over absurd pre-epoch / post-horizon windows must not raise.
            select count(*) into v_count
              from ash.samples('1000-01-01'::timestamptz, '1000-01-02'::timestamptz);
            assert v_count = 0, 'samples(pre-epoch) should return 0 rows';
            select count(*) into v_count
              from ash.samples('3000-01-01'::timestamptz, '3000-01-02'::timestamptz);
            assert v_count = 0, 'samples(post-horizon) should return 0 rows';
            -- Pre-epoch clamps to 0 across the aggregate readers too.
            select count(*) into v_count
              from ash.top('wait_event', '1000-01-01'::timestamptz, '1000-01-02'::timestamptz);
            assert v_count = 0, 'top(pre-epoch) should return 0 rows';
            -- Post-horizon (#63): the installer clamps v_end_ts to INT4_MAX in
            -- top/aas/timeline/report, so an absurd far-future window must return
            -- empty / null instead of raising 'integer out of range'.
            select count(*) into v_count
              from ash.top('wait_event', '3000-01-01'::timestamptz, '3000-01-02'::timestamptz);
            assert v_count = 0, 'top(post-horizon) should return 0 rows';
            -- aas is scalar (always 1 row) and timeline emits per-bucket no-data
            -- rows: the guarantee is "does not raise", so PERFORM is the assertion.
            perform * from ash.aas('3000-01-01'::timestamptz, '3000-01-02'::timestamptz);
            perform * from ash.timeline('3000-01-01'::timestamptz, '3000-01-02'::timestamptz);
            assert ash.report('3000-01-01'::timestamptz, '3000-01-02'::timestamptz) is null,
              'report(post-horizon) should be null';

            -- === decode_sample corner cases ===
            select count(*) into v_count from ash.decode_sample(null::integer[]);
            assert v_count = 0, 'null decode should return 0 rows';
            select count(*) into v_count from ash.decode_sample('{}'::integer[]);
            assert v_count = 0, 'empty decode should return 0 rows';
            select count(*) into v_count from ash.decode_sample('{-1,0}'::integer[]);
            assert v_count = 0, 'count=0 should return 0 rows';

            -- === Non-existent query id ===
            select count(*) into v_count
              from ash.samples(now() - interval '1 hour', now(), query_id => 999999999);
            assert v_count = 0, 'non-existent query should return 0 rows';

            -- === Rotation cycles 0 -> 1 -> 2 -> 0 (admin, unchanged) ===
            declare v_s0 smallint; v_s1 smallint; v_s2 smallint; v_s3 smallint;
            begin
              truncate ash.sample_0, ash.sample_1, ash.sample_2;
              select ash.current_slot() into v_s0;
              update ash.config set rotated_at = now() - interval '2 days';
              perform ash.rotate();
              select ash.current_slot() into v_s1;
              assert v_s1 = ((v_s0 + 1) % 3)::smallint, 'first rotation slot mismatch';
              update ash.config set rotated_at = now() - interval '2 days';
              perform ash.rotate();
              select ash.current_slot() into v_s2;
              assert v_s2 = ((v_s0 + 2) % 3)::smallint, 'second rotation slot mismatch';
              update ash.config set rotated_at = now() - interval '2 days';
              perform ash.rotate();
              select ash.current_slot() into v_s3;
              assert v_s3 = v_s0, 'third rotation should return to start';
            end;

            -- === Partition isolation: inactive-slot data is invisible to readers ===
            declare
              v_slot smallint; v_inactive smallint; v_ghost smallint;
              v_ts int4; v_found boolean;
            begin
              update ash.config set current_slot = 0 where singleton;
              select ash.current_slot() into v_slot;         -- 0; active = {0,2}
              v_inactive := ((v_slot + 1) % 3)::smallint;     -- 1
              select ash._register_wait('active', 'TestIsolation', 'GhostEvent') into v_ghost;
              v_ts := (ash.ts_from_timestamptz(date_trunc('minute', now() - interval '2 minutes')) / 60) * 60;
              v_from := ash.ts_to_timestamptz(v_ts);
              execute format(
                'insert into ash.sample_%s (sample_ts, datid, active_count, data, slot) values (%s, 1, 5, %L::integer[], %s)',
                v_inactive, v_ts, array[-v_ghost, 5, 0,0,0,0,0]::integer[], v_inactive);
              select exists (
                select 1 from ash.top('wait_event', v_from, now(), n => 100)
                where key = 'TestIsolation:GhostEvent'
              ) into v_found;
              assert not v_found, 'GhostEvent from inactive partition must not appear in ash.top';
              execute format('delete from ash.sample_%s where active_count = 5', v_inactive);
            end;

            -- === Rotation guard: refuses when called too soon ===
            declare v_result text;
            begin
              select ash.rotate() into v_result;
              assert v_result like 'skipped%', 'rotate() should skip when too soon, got ' || coalesce(v_result, 'NULL');
            end;

            -- === Multi-database: ash.top('database') sees each datid ===
            declare v_cpu smallint; v_ts int4; v_dbs int;
            begin
              select id into v_cpu from ash.wait_event_map where type = 'CPU*' and event = 'CPU*';
              if v_cpu is null then select ash._register_wait('active','CPU*','CPU*') into v_cpu; end if;
              update ash.config set current_slot = 0 where singleton;
              v_ts := (ash.ts_from_timestamptz(date_trunc('minute', now() - interval '2 minutes')) / 60) * 60;
              v_from := ash.ts_to_timestamptz(v_ts);
              insert into ash.sample (sample_ts, datid, active_count, data, slot) values
                (v_ts, 1, 1, array[-v_cpu, 1, 0]::integer[], 0),
                (v_ts, 99999, 1, array[-v_cpu, 1, 0]::integer[], 0);
              select count(*) into v_dbs from ash.top('database', v_from, now());
              assert v_dbs >= 2, 'ash.top(database) should show >= 2 databases, got ' || v_dbs;
            end;

            raise notice 'Edge and corner case tests PASSED';
          end $$;

          -- _wait_color helper (unchanged in 2.0; still used by ash.chart).
          do $$
          begin
            assert ash._wait_color('CPU*', true) = E'\033[38;2;080;250;123m', 'CPU* green';
            assert ash._wait_color('CPUsomething', true) = E'\033[38;2;080;250;123m', 'CPU prefix green';
            assert ash._wait_color('IdleTx', true) = E'\033[38;2;241;250;140m', 'IdleTx light yellow';
            assert ash._wait_color('IO:DataFileRead', true) = E'\033[38;2;030;100;255m', 'IO blue';
            assert ash._wait_color('Lock:tuple', true) = E'\033[38;2;255;085;085m', 'Lock red';
            assert ash._wait_color('LWLock:WALWrite', true) = E'\033[38;2;255;121;198m', 'LWLock pink';
            assert ash._wait_color('IPC:BgWorkerStartup', true) = E'\033[38;2;000;200;255m', 'IPC cyan';
            assert ash._wait_color('Client:ClientRead', true) = E'\033[38;2;255;220;100m', 'Client yellow';
            assert ash._wait_color('Timeout:PgSleep', true) = E'\033[38;2;255;165;000m', 'Timeout orange';
            assert ash._wait_color('BufferPin:BufferPin', true) = E'\033[38;2;000;210;180m', 'BufferPin teal';
            assert ash._wait_color('Activity:ArchiverMain', true) = E'\033[38;2;150;100;255m', 'Activity purple';
            assert ash._wait_color('Extension:DblinkGetResult', true) = E'\033[38;2;190;150;255m', 'Extension light purple';
            assert ash._wait_color('UnknownType:Whatever', true) = E'\033[38;2;180;180;180m', 'unknown gray';
            assert ash._wait_color('CPU*', false) = '', 'color=false returns empty';
            assert ash._wait_color('CPU*') = '', 'default color off';
            raise notice '_wait_color tests PASSED';
          end $$;
          EOF

      - name: "Test 2.0: input validation and least-privilege guards"
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 << 'EOF'
          -- Input validation and least-privilege guards that outlive the reader rework.
          do $$
          declare v_start record;
          begin
            -- ash.start(NULL) is handled at the function level with a clear error row,
            -- never touching ash.config.sample_interval.
            begin
              select * into v_start from ash.start(null::interval);
            exception when others then
              raise exception 'ash.start(NULL) must return an error row, got [%] %', sqlstate, sqlerrm;
            end;
            assert v_start.job_type = 'error',
              format('ash.start(NULL) must return job_type=error, got %s', v_start.job_type);
            assert v_start.status ilike '%null%',
              format('ash.start(NULL) must mention NULL in status, got %s', v_start.status);
            raise notice 'input validation PASSED';
          end $$;

          do $$
          begin
            if not exists (select from pg_roles where rolname = 'ash_reader_probe') then
              create role ash_reader_probe login password 'probe';
            end if;
          end $$;

          select ash.grant_reader('ash_reader_probe');

          do $$
          begin
            -- grant_reader hands out reader privileges only — never EXECUTE on an
            -- internal mutating helper.
            assert not has_function_privilege(
              'ash_reader_probe', 'ash._register_wait(text,text,text)', 'EXECUTE'),
              'grant_reader must not grant EXECUTE on ash._register_wait';
            -- ...but the granted role can call every 2.0 reader.
            assert has_function_privilege('ash_reader_probe',
              'ash.aas(timestamptz,timestamptz,text,text,bigint,name,interval)', 'EXECUTE'),
              'grant_reader should grant EXECUTE on ash.aas';
            assert has_function_privilege('ash_reader_probe',
              'ash.report(timestamptz,timestamptz,int,int)', 'EXECUTE'),
              'grant_reader should grant EXECUTE on ash.report';
            assert has_function_privilege('ash_reader_probe', 'ash.periods(timestamptz)', 'EXECUTE'),
              'grant_reader should grant EXECUTE on ash.periods';
            raise notice 'grant_reader least-privilege PASSED';
          end $$;
          EOF

